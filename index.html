<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Kênh & Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#15181d; --muted:#5d6470; --line:#dfe2e7; --soft:#eceef2;
  --accent:#1f4fd1; --accent-ink:#ffffff;
  --ok:#147a4b; --ok-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fdf0d8; --bad:#b4232c; --bad-bg:#fbe3e4; --off:#5d6470; --off-bg:#eceef2;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --panel:#171b22; --ink:#e8eaee; --muted:#9aa2ae; --line:#2a303a; --soft:#1f242c;
  --accent:#7aa2ff; --accent-ink:#0b1020;
  --ok:#5fd39a; --ok-bg:#12301f; --warn:#f2b456; --warn-bg:#352611; --bad:#ff7d84; --bad-bg:#3a1619; --off:#9aa2ae; --off-bg:#232831; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;font-weight:600}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.ghost{border-color:transparent;background:transparent;padding:6px 8px;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--soft)}
button.mini{padding:4px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:84px;resize:vertical}

/* ---- auth / gate screens ---- */
.center{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(400px,100%);display:grid;gap:14px;box-shadow:0 10px 40px rgba(10,12,20,.08)}
.card h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.card p.sub{margin:0;color:var(--muted);font-size:13px}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.err{color:var(--bad);font-size:13px;min-height:0}
.pwwrap{position:relative}
.pwwrap button{position:absolute;right:4px;top:4px;border:none;background:none;color:var(--muted);padding:5px 8px;font-size:12px}
.hint{font-size:12px;color:var(--muted)}

/* ---- app shell ---- */
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 56px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1.title{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--panel);padding:12px 14px;display:grid;gap:2px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.alert .v{color:var(--bad)} .stat.good .v{color:var(--ok)} .stat.warn .v{color:var(--warn)}
.stat .v{font-size:23px}
button.stat{text-align:left;border:none;border-radius:0;font-weight:400;cursor:pointer;font-family:inherit}
button.stat:hover{background:var(--soft)}
button.stat[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--accent)}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.fchip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.fchip.off{background:var(--off-bg);color:var(--off)}
.grp{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.grp>.gt{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cbs{display:grid;gap:8px}
.cbs label{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500;color:var(--ink)}
.cbs input{width:auto}
.locbar{display:flex;gap:6px;flex-wrap:wrap}
.locbtn{padding:7px 16px;border-radius:999px}
.locbtn[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.selcol{width:34px;text-align:center}
.selcol input{width:auto;cursor:pointer}
tr.picked td{background:var(--soft)}
.bulkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(10,12,20,.22);padding:10px 12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;z-index:25;max-width:calc(100% - 24px)}
.bulkbar .cnt2{font-weight:700;white-space:nowrap;margin-right:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:none;background:none;border-radius:0;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:12px;margin-left:6px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.toolbar select{width:auto}
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:880px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--soft)}
.mono{font-family:var(--f-mono);font-size:12.5px;word-break:break-all}
.small{font-size:12px;color:var(--muted)}
.chan a{color:var(--accent);text-decoration:none} .chan a:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-ok{color:var(--ok);background:var(--ok-bg)} .t-warn{color:var(--warn);background:var(--warn-bg)} .t-bad{color:var(--bad);background:var(--bad-bg)} .t-off{color:var(--off);background:var(--off-bg)}
.miss{display:flex;flex-wrap:wrap;gap:4px}
.mchip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;color:var(--bad);background:var(--bad-bg)}
.full{font-size:12px;color:var(--ok);font-weight:600}
.cnt{font-family:var(--f-mono);font-weight:600;color:var(--bad)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:15px}
.sev{width:4px;padding:0} .sev.s3{background:var(--bad)} .sev.s2{background:var(--warn)} .sev.s1{background:var(--line)}
tr.done td{color:var(--muted)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}

/* side sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:17px}
.sheet-b{flex:1;overflow:auto;padding:18px 20px;display:grid;gap:14px;align-content:start}
.sheet-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sheet-f .left{margin-right:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
.reveal{display:flex;gap:6px;align-items:center}
.reveal .val{flex:1;min-width:0;font-family:var(--f-mono);font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all;white-space:pre-wrap}
.hist{display:grid;gap:8px}
.hist .item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;display:grid;gap:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:30}
.imp-prev{font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:180px;overflow:auto}
code.k{font-family:var(--f-mono);font-size:12px;background:var(--soft);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sl .18s ease-out}@keyframes sl{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>

<!-- LOADING -->
<div id="scrLoad" class="center"><div class="card" style="text-align:center"><div class="small">Đang kết nối…</div></div></div>

<!-- LOGIN -->
<div id="scrLogin" class="center" hidden>
  <form class="card" id="frmLogin">
    <h1>Sổ Kênh &amp; Mail</h1>
    <p class="sub">Đăng nhập bằng tài khoản bạn đã tạo trong Firebase.</p>
    <div class="field"><label for="liEmail">Email</label><input id="liEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="liPw">Mật khẩu đăng nhập</label>
      <div class="pwwrap"><input id="liPw" type="password" autocomplete="current-password" required><button type="button" data-peek="liPw">Hiện</button></div>
    </div>
    <div class="err" id="liErr"></div>
    <button class="primary" type="submit" id="liBtn">Đăng nhập</button>
  </form>
</div>

<!-- MASTER PASSWORD GATE -->
<div id="scrGate" class="center" hidden>
  <form class="card" id="frmGate">
    <h1 id="gateTitle">Mật khẩu chính</h1>
    <p class="sub" id="gateSub"></p>
    <div class="field"><label for="gPw">Mật khẩu chính</label>
      <div class="pwwrap"><input id="gPw" type="password" autocomplete="off" required><button type="button" data-peek="gPw">Hiện</button></div>
    </div>
    <div class="field" id="gPw2Wrap" hidden><label for="gPw2">Nhập lại mật khẩu chính</label>
      <div class="pwwrap"><input id="gPw2" type="password" autocomplete="off"><button type="button" data-peek="gPw2">Hiện</button></div>
    </div>
    <div class="err" id="gErr"></div>
    <button class="primary" type="submit" id="gBtn">Mở khóa</button>
    <p class="hint" id="gHint"></p>
    <button type="button" class="ghost" id="gLogout" style="justify-self:start">Đăng xuất</button>
  </form>
</div>

<!-- APP -->
<div id="scrApp" class="wrap" hidden>
  <header>
    <div>
      <h1 class="title">Sổ Kênh &amp; Mail</h1>
      <p class="sub">Email nhân viên, kênh YouTube và sự cố — dữ liệu mã hóa, đồng bộ mọi máy.</p>
    </div>
    <div class="hbtns">
      <button id="btnImport">Nhập hàng loạt</button>
      <button id="btnDup">Quét trùng</button>
      <button id="btnExport">Xuất CSV</button>
      <button id="btnNewInc">Báo sự cố</button>
      <button id="btnNewAcc" class="primary">Thêm mail</button>
      <button id="btnLock" class="ghost" title="Khóa lại">🔒</button>
      <button id="btnLogout" class="ghost" title="Đăng xuất">Thoát</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div class="locbar" id="locbar">
    <button class="locbtn" data-loc="all">Tất cả</button>
    <button class="locbtn" data-loc="home">🏠 Nhà</button>
    <button class="locbtn" data-loc="company">🏢 Công ty</button>
  </div>

  <section class="stats">
    <button class="stat good" data-f="live"><span class="k">Mail đang live</span><span class="v" id="sLive">0</span></button>
    <button class="stat" data-f="working"><span class="k">Đang làm</span><span class="v" id="sWork">0</span></button>
    <button class="stat warn" data-f="changed_no"><span class="k">Chưa đổi thông tin</span><span class="v" id="sChg">0</span></button>
    <button class="stat warn" data-f="miss"><span class="k">Thiếu thông tin</span><span class="v" id="sMiss">0</span></button>
    <button class="stat alert" data-f="phone"><span class="k">SĐT sắp hết hạn</span><span class="v" id="sPhone">0</span></button>
    <button class="stat warn" data-f="restricted"><span class="k">Bị hạn chế</span><span class="v" id="sRes">0</span></button>
    <button class="stat alert" data-f="appeal_check"><span class="k">Cần check kháng</span><span class="v" id="sApp">0</span></button>
    <button class="stat warn" data-f="redo"><span class="k">Chuẩn bị làm lại</span><span class="v" id="sRedo">0</span></button>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabAcc" aria-selected="true">Mail &amp; kênh<span class="n" id="nAcc">0</span></button>
    <button class="tab" role="tab" id="tabGa" aria-selected="false">🐔 Gà<span class="n" id="nGa">0</span></button>
    <button class="tab" role="tab" id="tabInc" aria-selected="false">Sự cố<span class="n" id="nInc">0</span></button>
  </div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Tìm email, nhân viên, tên kênh…">
    <select id="fStaff" aria-label="Lọc nhân viên"></select>
    <select id="fStatus" aria-label="Lọc trạng thái"></select>
  </div>

  <div class="tablebox" id="list"><div class="empty">Đang tải…</div></div>
</div>

<div id="bulkbar" class="bulkbar" hidden></div>
<div id="sheetHost"></div>
<div id="toast" class="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, getDoc, onSnapshot, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDZXcVowP2-bdmXPKlVPclTTh8Azk2Nofw",
  authDomain: "ccgg-f93d8.firebaseapp.com",
  projectId: "ccgg-f93d8",
  storageBucket: "ccgg-f93d8.firebasestorage.app",
  messagingSenderId: "199733602952",
  appId: "1:199733602952:web:2aadf04a9e3c2dbbdecd3d"
};
const fapp = initializeApp(firebaseConfig);
const auth = getAuth(fapp);
const db = getFirestore(fapp);

/* ---------------- constants ---------------- */
const ACC_STATUS={active:["Đang dùng","t-ok"],verify:["Cần xác minh","t-warn"],locked:["Bị khóa","t-bad"],retired:["Ngưng dùng","t-off"]};
const CH_STATUS={none:["Chưa có kênh","t-off"],normal:["Bình thường","t-ok"],strike:["Có gậy","t-warn"],demonetized:["Mất kiếm tiền","t-warn"],limited:["Bị hạn chế","t-warn"],terminated:["Bị chấm dứt","t-bad"]};
const TFA={off:["Chưa bật","t-off"],on:["Đã bật","t-ok"]};
const INC_TYPE={copyright:"Gậy bản quyền",guidelines:"Gậy nguyên tắc cộng đồng",monetization:"Tắt kiếm tiền",removed:"Video bị gỡ",access:"Mất quyền truy cập",hacked:"Bị hack",login:"Lỗi đăng nhập / xác minh",other:"Khác"};
const SEV={3:["Nghiêm trọng","t-bad"],2:["Trung bình","t-warn"],1:["Thấp","t-off"]};
const LOCATION={home:["🏠 Nhà","t-ok"],company:["🏢 Công ty","t-warn"]};
const STAGE={none:["Chưa phân loại","t-off"],working:["Đang làm","t-ok"],redo:["Chuẩn bị làm lại","t-warn"],ga:["Tạo gà","t-warn"]};
const APPEAL={none:["Không","t-off"],wait_phone:["Đợi add số","t-warn"],wait_appeal:["Đợi kháng","t-warn"],appealed:["Đã kháng chờ KQ","t-warn"]};
const DAY=86400000, PHONE_DAYS=90, PHONE_WARN=20, APPEAL_CHECK_DAYS=2;
const VERIFY_CONST="SKM-UNLOCK-OK-v1";

/* ---------------- crypto ---------------- */
const te=new TextEncoder(), td=new TextDecoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let CKEY=null;
async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encField(text){
  if(text===undefined||text===null||text==="")return "";
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},CKEY,te.encode(String(text)));
  return {iv:b64(iv),ct:b64(ct)};
}
async function decField(obj){
  if(!obj||typeof obj!=="object"||!obj.ct)return "";
  try{const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(obj.iv)},CKEY,unb64(obj.ct));return td.decode(pt);}
  catch(e){return "⚠️ sai mật khẩu chính";}
}
const hasVal=o=>o&&typeof o==="object"&&!!o.ct;
/* vân tay (hash) để chống trùng mà không lộ nội dung */
async function sha256hex(s){const b=await crypto.subtle.digest("SHA-256",te.encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const normPhone=s=>String(s||"").replace(/\D/g,"");
const norm2fa=s=>String(s||"").replace(/\s+/g,"").toLowerCase();
const hashPhone=async v=>{const n=normPhone(v);return n?await sha256hex("p:"+n):""};
const hash2fa=async v=>{const n=norm2fa(v);return n?await sha256hex("t:"+n):""};
async function phoneHashOf(a){if(a.phoneHash!==undefined&&a.phoneHash!=="")return a.phoneHash;if(a.phoneHash==="")return "";if(!hasVal(a.phone))return "";return hashPhone(await decField(a.phone))}
async function twofaHashOf(a){if(a.twofaHash!==undefined&&a.twofaHash!=="")return a.twofaHash;if(a.twofaHash==="")return "";if(!hasVal(a.twofaRecovery))return "";return hash2fa(await decField(a.twofaRecovery))}

/* ---------------- state ---------------- */
const S={accounts:[],incidents:[],tab:"acc",loc:"all",q:"",staff:"",status:"",loaded:{a:false,i:false},sel:new Set(),lastAccIds:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pill=(m,k)=>{const x=m[k];return x?`<span class="pill ${x[1]}">${x[0]}</span>`:""};
const show=(id,on)=>{$(id).hidden=!on};
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
try{const u=JSON.parse(localStorage.getItem("skm-ui")||"{}");if(u.tab)S.tab=u.tab;if(u.loc)S.loc=u.loc}catch(e){}
const saveUi=()=>{try{localStorage.setItem("skm-ui",JSON.stringify({tab:S.tab,loc:S.loc}))}catch(e){}};

/* which fields count as "missing" */
function missingOf(a){
  const m=[];
  if(!hasVal(a.password))m.push("Mật khẩu");
  if(!hasVal(a.recovery))m.push("Mail KP");
  if(!hasVal(a.phone))m.push("SĐT");
  if(a.twofaStatus!=="on")m.push("2FA");
  else if(!hasVal(a.twofaRecovery))m.push("Mã 2FA");
  return m;
}
const locOf=a=>a.location==="company"?"company":"home";              // mặc định: Nhà
const stageOf=a=>STAGE[a.stage]?a.stage:"none";
const appealOf=a=>APPEAL[a.appeal]?a.appeal:"none";
const isGa=a=>stageOf(a)==="ga";
const isWorking=a=>stageOf(a)==="working";
const isRedo=a=>stageOf(a)==="redo";
const isLive=a=>a.accountStatus!=="locked"&&a.accountStatus!=="retired";
const hasProblem=a=>a.accountStatus==="locked"||a.accountStatus==="verify"||["strike","demonetized","limited","terminated"].includes(a.channelStatus);
const restricted=a=>a.channelStatus==="limited";
const notChanged=a=>a.infoChanged!==true;
const phoneBase=a=>a.phoneDate||a.createdAt||Date.now();
const phoneDaysLeft=a=>Math.ceil((phoneBase(a)+PHONE_DAYS*DAY-Date.now())/DAY);
const phoneSoon=a=>phoneDaysLeft(a)<=PHONE_WARN;
const needAppealCheck=a=>appealOf(a)==="appealed"&&a.appealedAt&&(Date.now()-a.appealedAt)>=APPEAL_CHECK_DAYS*DAY;
const inLoc=a=>S.loc==="all"||locOf(a)===S.loc;
const accById=id=>S.accounts.find(a=>a.id===id);
const openCount=id=>S.incidents.filter(i=>i.accountId===id&&i.status!=="resolved").length;
/* helpers ngày */
const dinput=ms=>{if(!ms)return "";const d=new Date(ms);return isNaN(d)?"":new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const dparse=v=>{if(!v)return null;const t=new Date(v+"T00:00:00").getTime();return isNaN(t)?null:t};
const dshow=ms=>ms?new Date(ms).toLocaleDateString("vi-VN"):"—";

async function openGate(){
  show("scrApp",false);show("scrGate",true);
  $("gErr").textContent="";$("gPw").value="";$("gPw2").value="";
  let meta=null;
  try{meta=await getDoc(doc(db,"meta","crypto"))}catch(e){$("gErr").textContent="Không đọc được dữ liệu. Kiểm tra lại rules Firestore.";return}
  const first=!meta.exists();
  $("gPw2Wrap").hidden=!first;
  $("gateTitle").textContent=first?"Tạo mật khẩu chính":"Mở khóa";
  $("gateSub").textContent=first?"Lần đầu dùng: đặt một mật khẩu chính để mã hóa mật khẩu và 2FA. Mật khẩu này KHÔNG lưu trên máy chủ.":"Nhập mật khẩu chính để mở khóa dữ liệu trên máy này.";
  $("gBtn").textContent=first?"Tạo và mở khóa":"Mở khóa";
  $("gHint").textContent=first?"⚠️ Nhớ thật kỹ. Quên mật khẩu chính thì không khôi phục được phần đã mã hóa — đó là điều khiến nó an toàn.":"Dùng đúng mật khẩu chính bạn đã đặt lúc đầu (giống trên mọi máy).";
  $("gPw").focus();
  // try cached master key (this session)
  try{const cached=sessionStorage.getItem("skm-mk");if(cached&&!first){if(await tryUnlock(cached,meta))return}}catch(e){}
}

$("frmGate").addEventListener("submit",async e=>{
  e.preventDefault();$("gErr").textContent="";$("gBtn").disabled=true;
  try{
    const meta=await getDoc(doc(db,"meta","crypto"));
    const first=!meta.exists();
    const pw=$("gPw").value;
    if(pw.length<6){$("gErr").textContent="Mật khẩu chính cần ít nhất 6 ký tự.";return}
    if(first){
      if(pw!==$("gPw2").value){$("gErr").textContent="Hai ô mật khẩu chính chưa khớp.";return}
      const salt=crypto.getRandomValues(new Uint8Array(16));
      CKEY=await deriveKey(pw,salt);
      const verifier=await encField(VERIFY_CONST);
      await setDoc(doc(db,"meta","crypto"),{salt:b64(salt),verifier,createdAt:Date.now()});
      cacheMk(pw);enterApp();
    }else{
      if(!await tryUnlock(pw,meta)){$("gErr").textContent="Sai mật khẩu chính.";CKEY=null}
    }
  }catch(err){$("gErr").textContent="Lỗi: "+(err.code||err.message)}
  finally{$("gBtn").disabled=false}
});

async function tryUnlock(pw,meta){
  const d=meta.data();
  CKEY=await deriveKey(pw,unb64(d.salt));
  const check=await decField(d.verifier);
  if(check===VERIFY_CONST){cacheMk(pw);enterApp();return true}
  CKEY=null;return false;
}
function cacheMk(pw){try{sessionStorage.setItem("skm-mk",pw)}catch(e){}}

      if(S.staff&&x.staff!==S.staff)return false;

      if(S.status==="redo"&&!isRedo(x))return false;

async function bulkWrite(ids,fn,msg){
  try{let batch=writeBatch(db),n=0;for(const id of ids){fn(batch,id);if(++n>=400){await batch.commit();batch=writeBatch(db);n=0}}if(n>0)await batch.commit();S.sel.clear();toast(msg);render();}
  catch(e){toast("Lỗi: "+(e.code||e.message))}
}
function bulkAction(kind){
  if(kind==="clear"){S.sel.clear();render();return}

/* ---------------- bulk import ---------------- */
const stripD=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().trim();
const HMAP=[
  [["email","mail","gmail","tai khoan"],"email"],
  [["mat khau","matkhau","password","pass","mk"],"password"],
  [["nhan vien","nhanvien","staff","nv","phu trach"],"staff"],
  [["khoi phuc","recovery","mail kp","mail khoi phuc","recovery email"],"recovery"],
  [["sdt","so dien thoai","phone","dien thoai","sodienthoai"],"phone"],
  [["ma 2fa","2fa recovery","ma khoi phuc 2fa","backup codes","ma du phong"],"twofaRecovery"],
  [["2fa","bao mat 2 lop","two factor"],"twofaFlag"],
  [["noi quan ly","noi","khu vuc","nhom","location"],"location"],
  [["ngay mua","purchase date","ngaymua"],"purchaseDate"],
  [["nguon mua","nguon","source","purchase source","nguonmua"],"purchaseSource"],
  [["ten kenh","kenh","channel","channel name"],"channelName"],
  [["link","url","link kenh","channel url"],"channelUrl"],
  [["ghi chu","note","notes","ghichu"],"note"],
];
function mapHeader(h){const n=stripD(h);for(const[keys,f]of HMAP)if(keys.includes(n))return f;for(const[keys,f]of HMAP)if(keys.some(k=>n.includes(k)))return f;return null}
function locFromText(v){const n=stripD(v);if(!n)return null;if(n.includes("cong ty")||n==="cty"||n.includes("company")||n.includes("cq")||n.includes("cong"))return "company";if(n.includes("nha")||n.includes("home"))return "home";return null}
const EMAIL_RE=/^\S+@\S+\.\S+$/;
function parseText(txt){
  const lines=txt.replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return{cols:[],rows:[]};
  // Trường hợp chỉ dán danh sách email (mỗi dòng một email, không có tiêu đề)
  const noDelim=lines.every(l=>!/[\t,;]/.test(l));
  const emailish=lines.filter(l=>EMAIL_RE.test(l)).length;
  if(noDelim&&EMAIL_RE.test(lines[0])&&emailish>=Math.ceil(lines.length*0.6)){
    return{cols:["email"],header:["email"],rows:lines.map(l=>[l]),bare:true};
  }
  const delim=lines[0].includes("\t")?"\t":(lines[0].split(";").length>lines[0].split(",").length?";":",");
  const cells=l=>l.split(delim).map(c=>c.trim().replace(/^"|"$/g,""));
  const header=cells(lines[0]);const cols=header.map(mapHeader);
  const rows=lines.slice(1).map(l=>cells(l));
  return{cols,header,rows};
}
function openImport(){
  sheet("Nhập hàng loạt",`
    <p class="hint"><b>Cách 1 — chỉ email:</b> dán danh sách email, mỗi email một dòng (không cần tiêu đề). App thêm hết, thông tin khác để trống bổ sung sau.<br><b>Cách 2 — đầy đủ:</b> dán bảng từ Excel/Google Sheet có dòng tiêu đề, hoặc chọn file CSV/TXT. Cột nhận được: <code class="k">email</code> <code class="k">mật khẩu</code> <code class="k">nhân viên</code> <code class="k">khôi phục</code> <code class="k">sđt</code> <code class="k">2fa</code> <code class="k">mã 2fa</code> <code class="k">nơi quản lý</code> <code class="k">ngày mua</code> <code class="k">nguồn mua</code> <code class="k">tên kênh</code> <code class="k">link</code> <code class="k">ghi chú</code>.</p>
    <button type="button" id="bTpl" class="mini">⬇ Tải file mẫu (CSV)</button>
    <div class="field"><label for="impLoc">Nếu cột "Nơi quản lý" để trống thì xếp vào nhóm:</label><select id="impLoc">${opt(LOCATION,S.loc==="company"?"company":"home")}</select></div>
    <div class="field"><label for="impFile">Chọn file (tùy chọn)</label><input id="impFile" type="file" accept=".csv,.txt,.tsv"></div>
    <div class="field"><label for="impText">Hoặc dán vào đây</label><textarea id="impText" style="min-height:140px" placeholder="Dán danh sách email, mỗi dòng một email:
kenh01@gmail.com
kenh02@gmail.com
kenh03@gmail.com"></textarea></div>
    <div id="impPrev"></div>
  `,`<button type="button" id="bCancel">Hủy</button><button class="primary" id="bDo" disabled>Nhập</button>`);
  $("bCancel").onclick=closeSheet;
  $("bTpl").onclick=downloadTemplate;
  let parsed=null;
  const preview=()=>{
    const txt=$("impText").value;parsed=txt.trim()?parseText(txt):null;
    const box=$("impPrev");
    if(!parsed){box.innerHTML="";$("bDo").disabled=true;return}
    const ei=parsed.cols.indexOf("email");
    const valid=ei>=0?parsed.rows.filter(r=>r[ei]&&/^\S+@\S+\.\S+$/.test(r[ei])).length:0;
    const got=parsed.cols.filter(Boolean);
    const bareNote=parsed.bare?'<br><span style="color:var(--ok)">Chế độ danh sách email: chỉ thêm email, các thông tin khác để trống (bổ sung sau).</span>':"";
    box.innerHTML=`<div class="imp-prev">${parsed.bare?"":"Nhận diện cột: <b>"+(got.length?got.join(", "):"(không rõ)")+"</b><br>"}Số email hợp lệ: <b>${valid}</b>${bareNote}${ei<0?'<br><span style="color:var(--bad)">⚠️ Chưa thấy cột email — kiểm tra lại dòng tiêu đề.</span>':""}</div>`;
    $("bDo").disabled=!(valid>0);$("bDo").textContent=`Nhập ${valid} mail`;
  };
  $("impText").oninput=preview;
  $("impFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("impText").value=r.result;preview()};r.readAsText(f,"UTF-8")};
  $("bDo").onclick=async()=>{
    if(!parsed)return;
    const defLoc=$("impLoc").value;
    const ci={};parsed.cols.forEach((c,idx)=>{if(c)ci[c]=idx});
    const existing=new Set(S.accounts.map(a=>a.email));
    const valid=parsed.rows.filter(r=>r[ci.email]&&/^\S+@\S+\.\S+$/.test(r[ci.email].trim()));
    $("bDo").disabled=true;$("bDo").textContent="Đang kiểm tra trùng…";
    let added=0,skEmail=0,skPhone=0,sk2fa=0;
    try{
      // tập vân tay SĐT/2FA đã có (giải mã dữ liệu cũ nếu cần)
      const existPhone=new Map(),exist2fa=new Map();
      for(const a of S.accounts){const ph=await phoneHashOf(a);if(ph)existPhone.set(ph,a.email);const th=await twofaHashOf(a);if(th)exist2fa.set(th,a.email);}
      $("bDo").textContent="Đang mã hóa & nhập…";
      let batch=writeBatch(db),n=0;
      for(const r of valid){
        const g=k=>ci[k]!=null?(r[ci[k]]||"").trim():"";
        const email=g("email").toLowerCase();
        if(existing.has(email)){skEmail++;continue}
        const tfaFlag=g("twofaFlag");const tfaRec=g("twofaRecovery");const phPlain=g("phone");
        const phh=await hashPhone(phPlain), thh=await hash2fa(tfaRec);
        if(phh&&existPhone.has(phh)){skPhone++;continue}
        if(thh&&exist2fa.has(thh)){sk2fa++;continue}
        existing.add(email);if(phh)existPhone.set(phh,email);if(thh)exist2fa.set(thh,email);
        const d={email,staff:g("staff"),channelName:g("channelName"),channelUrl:g("channelUrl"),note:g("note"),
          location:locFromText(g("location"))||defLoc,infoChanged:false,
          accountStatus:"active",channelStatus:g("channelName")?"normal":"none",
          stage:"none",appeal:"none",appealedAt:null,workStartDate:null,
          purchaseDate:dparse(g("purchaseDate")),purchaseSource:g("purchaseSource"),phoneDate:Date.now(),
          idVerified:false,taxAdded:false,bankAdded:false,monetized:false,gaSold:false,gaLinkedTo:"",
          phoneHash:phh,twofaHash:thh,
          twofaStatus:(tfaRec||/^(co|yes|on|bat|x|1|true)$/i.test(stripD(tfaFlag)))?"on":"off",
          password:await encField(g("password")),recovery:await encField(g("recovery")),phone:await encField(phPlain),
          twofaRecovery:await encField(tfaRec),createdAt:Date.now(),updatedAt:Date.now()};
        batch.set(doc(db,"accounts",crypto.randomUUID()),d);added++;n++;
        if(n>=400){await batch.commit();batch=writeBatch(db);n=0}
      }
      if(n>0)await batch.commit();
      const sk=[];if(skEmail)sk.push(`${skEmail} trùng email`);if(skPhone)sk.push(`${skPhone} trùng SĐT`);if(sk2fa)sk.push(`${sk2fa} trùng 2FA`);
      closeSheet();toast(`Đã nhập ${added} mail${sk.length?`, bỏ qua ${sk.join(", ")}`:""}`);
    }catch(e){$("impPrev").innerHTML=`<div class="imp-prev" style="color:var(--bad)">Lỗi khi nhập: ${esc(e.code||e.message)}. Đã nhập ${added} mail trước đó.</div>`;$("bDo").disabled=false;$("bDo").textContent="Thử lại"}
  };
}

function downloadFile(name,text,type){
  const url=URL.createObjectURL(new Blob([text],{type:type||"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function downloadTemplate(){
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const head=["Email","Mật khẩu","Nhân viên","Mail khôi phục","SĐT","2FA","Mã 2FA","Nơi quản lý","Ngày mua","Nguồn mua","Tên kênh","Link kênh","Ghi chú"];
  const rows=[
    ["vd.nha@gmail.com","matkhau123","Nguyễn Văn A","kp.a@gmail.com","0901234567","Có","ABC1-DEF2-GHI3","Nhà","2026-01-05","Shop ABC","Bếp Nhà Mình","https://www.youtube.com/@bepnhaminh","(dòng ví dụ - xóa trước khi nhập)"],
    ["vd.cty@gmail.com","matkhau456","Trần Thị B","kp.b@gmail.com","0907654321","Chưa","","Công ty","2026-02-10","Mối quen","Review Công Nghệ","","(dòng ví dụ - xóa trước khi nhập)"]
  ];
  const csv="﻿"+[head.map(q).join(","),...rows.map(r=>r.map(q).join(","))].join("\r\n");
  downloadFile("mau-nhap-mail.csv",csv);
  toast("Đã tải file mẫu");
}

/* ---------------- export ---------------- */
async function exportCsv(){
  if(!S.accounts.length){toast("Chưa có dữ liệu");return}
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const yn=v=>v?"Có":"";
  const head=["Email","Nơi quản lý","Nhân viên","Giai đoạn","Mật khẩu","Mail khôi phục","SĐT","SĐT hết hạn","Còn (ngày)","2FA","Mã 2FA","Đã đổi TT","Ngày mua","Nguồn mua","Ngày bắt đầu làm","Trạng thái email","Tình trạng kênh","Tình trạng kháng","Xác minh DT","Thuế","Bank","Kiếm tiền","Gà đã bán","Nối vào","Tên kênh","Link kênh","Thiếu","Ghi chú"];
  const lines=[];
  for(const a of S.accounts){
    lines.push([a.email,LOCATION[locOf(a)][0].replace(/^..\s/,""),a.staff,STAGE[stageOf(a)][0],
      await decField(a.password),await decField(a.recovery),await decField(a.phone),
      dshow(phoneBase(a)+PHONE_DAYS*DAY),phoneDaysLeft(a),
      a.twofaStatus==="on"?"Đã bật":"Chưa",await decField(a.twofaRecovery),a.infoChanged?"Rồi":"Chưa",
      a.purchaseDate?dshow(a.purchaseDate):"",a.purchaseSource,a.workStartDate?dshow(a.workStartDate):"",
      ACC_STATUS[a.accountStatus]?.[0],CH_STATUS[a.channelStatus]?.[0],APPEAL[appealOf(a)][0],
      yn(a.idVerified),yn(a.taxAdded),yn(a.bankAdded),yn(a.monetized),yn(a.gaSold),a.gaLinkedTo,
      a.channelName,a.channelUrl,missingOf(a).join(" / "),a.note].map(q).join(","));
  }
  const csv="﻿"+[head.map(q).join(","),...lines].join("\r\n");
  downloadFile(`so-mail-${new Date().toISOString().slice(0,10)}.csv`,csv);
  toast("Đã tải CSV");
}
$("btnExport").onclick=()=>{
  sheet("Xuất CSV",`<p>File CSV sẽ chứa <b>mật khẩu, mã 2FA và mọi thông tin ở dạng chữ thường (không mã hóa)</b>, để bạn mở bằng Excel.</p><p class="hint">Chỉ xuất khi cần sao lưu, và giữ file thật cẩn thận. Xóa file sau khi dùng xong.</p>`,`<button type="button" id="bCancel">Hủy</button><button class="primary" id="bDo">Tải file ngay</button>`);
  $("bCancel").onclick=closeSheet;$("bDo").onclick=()=>{closeSheet();exportCsv()};
};

/* ---------------- wiring ---------------- */
$("tabAcc").onclick=()=>{S.tab="acc";S.status="";S.sel.clear();saveUi();render()};
$("tabGa").onclick=()=>{S.tab="ga";S.status="";S.sel.clear();saveUi();render()};
$("tabInc").onclick=()=>{S.tab="inc";S.status="";S.sel.clear();saveUi();render()};
$("q").oninput=e=>{S.q=e.target.value;render()};
$("fStaff").onchange=e=>{S.staff=e.target.value;render()};
$("fStatus").onchange=e=>{S.status=e.target.value;render()};
$("btnNewAcc").onclick=()=>openAccount();
$("btnNewInc").onclick=()=>openIncident();
$("btnImport").onclick=openImport;
$("btnDup").onclick=scanDuplicates;
$("locbar").addEventListener("click",e=>{const b=e.target.closest(".locbtn");if(!b)return;S.loc=b.dataset.loc;S.sel.clear();saveUi();render()});
document.querySelector(".stats").addEventListener("click",e=>{const b=e.target.closest(".stat");if(!b)return;S.tab="acc";S.status=S.status===b.dataset.f?"":b.dataset.f;saveUi();render()});
$("list").addEventListener("click",e=>{
  const ck=e.target.closest("input.rowck");if(ck){toggleSel(ck.dataset.id,ck.checked);e.stopPropagation();return}
  if(e.target.id==="selAll"){toggleAll(e.target.checked);return}
  const tr=e.target.closest("tr[data-acc],tr[data-inc]");if(!tr)return;tr.dataset.acc?openAccount(tr.dataset.acc):openIncident(tr.dataset.inc);
});
</script>
