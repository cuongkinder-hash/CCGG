<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Kênh & Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#15181d; --muted:#5d6470; --line:#dfe2e7; --soft:#eceef2;
  --accent:#1f4fd1; --accent-ink:#ffffff;
  --ok:#147a4b; --ok-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fdf0d8; --bad:#b4232c; --bad-bg:#fbe3e4; --off:#5d6470; --off-bg:#eceef2;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --panel:#171b22; --ink:#e8eaee; --muted:#9aa2ae; --line:#2a303a; --soft:#1f242c;
  --accent:#7aa2ff; --accent-ink:#0b1020;
  --ok:#5fd39a; --ok-bg:#12301f; --warn:#f2b456; --warn-bg:#352611; --bad:#ff7d84; --bad-bg:#3a1619; --off:#9aa2ae; --off-bg:#232831; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;font-weight:600}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.ghost{border-color:transparent;background:transparent;padding:6px 8px;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--soft)}
button.mini{padding:4px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:84px;resize:vertical}

/* ---- auth / gate screens ---- */
.center{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(400px,100%);display:grid;gap:14px;box-shadow:0 10px 40px rgba(10,12,20,.08)}
.card h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.card p.sub{margin:0;color:var(--muted);font-size:13px}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.err{color:var(--bad);font-size:13px;min-height:0}
.pwwrap{position:relative}
.pwwrap button{position:absolute;right:4px;top:4px;border:none;background:none;color:var(--muted);padding:5px 8px;font-size:12px}
.hint{font-size:12px;color:var(--muted)}

/* ---- app shell ---- */
.wrap{max-width:none;margin:0;padding:18px 20px 56px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1.title{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--panel);padding:12px 14px;display:grid;gap:2px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.alert .v{color:var(--bad)} .stat.good .v{color:var(--ok)} .stat.warn .v{color:var(--warn)}
.stat .v{font-size:23px}
button.stat{text-align:left;border:none;border-radius:0;font-weight:400;cursor:pointer;font-family:inherit}
button.stat:hover{background:var(--soft)}
button.stat[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--accent)}
.flags{display:flex;flex-wrap:nowrap;gap:4px;align-items:center}
.fchip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.fchip.off{background:var(--off-bg);color:var(--off)}
.grp{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.grp>.gt{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cbs{display:grid;gap:8px}
.cbs label{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500;color:var(--ink)}
.cbs input{width:auto}
.locbar{display:flex;gap:6px;flex-wrap:wrap}
.locbtn{padding:7px 16px;border-radius:999px}
.locbtn[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.selcol{width:34px;text-align:center}
.selcol input{width:auto;cursor:pointer}
tr.picked td{background:var(--soft)}
.bulkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(10,12,20,.22);padding:10px 12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;z-index:25;max-width:calc(100% - 24px)}
.bulkbar .cnt2{font-weight:700;white-space:nowrap;margin-right:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:none;background:none;border-radius:0;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:12px;margin-left:6px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.toolbar select{width:auto}
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:880px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--soft)}
.mono{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.cpmail{cursor:pointer;border-radius:4px;padding:1px 2px}
.tgchip{cursor:pointer}.tgchip:hover{filter:brightness(.95)}
tr.trow td{background:var(--soft);cursor:pointer}tr.trow:hover td{filter:brightness(.97)}.tfold{display:inline-block;width:14px;color:var(--muted)}
.cpmail:hover{text-decoration:underline dotted;background:var(--soft)}
.small{font-size:12px;color:var(--muted)}
.chan a{color:var(--accent);text-decoration:none} .chan a:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-ok{color:var(--ok);background:var(--ok-bg)} .t-warn{color:var(--warn);background:var(--warn-bg)} .t-bad{color:var(--bad);background:var(--bad-bg)} .t-off{color:var(--off);background:var(--off-bg)}
.miss{display:flex;flex-wrap:nowrap;gap:4px}
.mchip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;color:var(--bad);background:var(--bad-bg)}
.full{font-size:12px;color:var(--ok);font-weight:600}
.cnt{font-family:var(--f-mono);font-weight:600;color:var(--bad)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:15px}
.sev{width:4px;padding:0} .sev.s3{background:var(--bad)} .sev.s2{background:var(--warn)} .sev.s1{background:var(--line)}
tr.done td{color:var(--muted)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}

/* side sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:17px}
.sheet-b{flex:1;overflow:auto;padding:18px 20px;display:grid;gap:14px;align-content:start;grid-auto-rows:max-content}
.sheet-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sheet-f .left{margin-right:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
.reveal{display:flex;gap:6px;align-items:center}
.reveal .val{flex:1;min-width:0;font-family:var(--f-mono);font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all;white-space:pre-wrap}
.hist{display:grid;gap:8px}
.hist .item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;display:grid;gap:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:30}
.imp-prev{font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:180px;overflow:auto}
code.k{font-family:var(--f-mono);font-size:12px;background:var(--soft);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sl .18s ease-out}@keyframes sl{from{transform:translateX(24px);opacity:.6}}}
/* ---- bảng nhập ---- */
.sheet.wide{width:min(1500px,100%)}
.gridwrap{overflow:auto;max-height:58vh;border:1px solid var(--line);border-radius:10px}
table.grid{min-width:0;border-collapse:separate;border-spacing:0}
table.grid th{position:sticky;top:0;z-index:2;padding:7px 8px;font-size:11px}
table.grid td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
table.grid tbody tr{cursor:default} table.grid tbody tr:hover td{background:inherit}
table.grid td input,table.grid td select{border:none;border-radius:0;padding:6px 8px;font-size:13px;background:transparent;width:100%;min-width:0}
table.grid td input:focus,table.grid td select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--panel)}
table.grid td.bad{background:var(--bad-bg)}
table.grid .gnum{width:36px;text-align:center;color:var(--muted);font-size:11px;position:sticky;left:0;background:var(--soft);z-index:1}
table.grid tr.gerr td.gnum{background:var(--bad-bg);color:var(--bad)}
table.grid td.gstat{padding:0 6px;font-size:11px}
/* ---- Today / Thanh Thanh ---- */
.daygrid{display:grid;grid-template-columns:minmax(340px,1fr) minmax(380px,1.15fr);gap:16px;padding:16px;align-items:start}
@media (max-width:980px){.daygrid{grid-template-columns:1fr}}
.dpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;min-width:0}
.dpanel>.ph{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;justify-content:space-between}
.dpanel>.ph h3{margin:0;font-size:16px}
.dpanel>.pb{padding:12px 14px;display:grid;gap:12px}
.chat{height:52vh;min-height:320px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:86%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;font-size:14px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.tt{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .meta{display:block;font-size:11px;opacity:.7;margin-top:4px;white-space:normal}
.msg .chg{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.actbox{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-size:13px;display:grid;gap:3px;white-space:normal}
.actbox.undone{background:var(--off-bg);color:var(--off);text-decoration:line-through}
.actbox.undone .small{text-decoration:none}
.actbox button{justify-self:start;margin-top:4px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ff9ac2,#b18cff);display:grid;place-items:center;font-size:20px;flex:none}
.chatin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.chatin textarea{min-height:44px;max-height:160px;resize:none}
.mic.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.avatar img,.ttfab img{width:100%;height:100%;object-fit:cover;border-radius:50%}
/* Thanh Thanh nổi ở góc */
.actbox.plan{border-color:var(--accent)}
.ttfab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0));width:60px;height:60px;border-radius:50%;border:3px solid var(--panel);padding:0;background:linear-gradient(135deg,#ff9ac2,#b18cff);font-size:30px;display:grid;place-items:center;box-shadow:0 8px 26px rgba(10,12,20,.3);cursor:pointer;z-index:40;transition:transform .15s}
.ttfab:hover{transform:scale(1.07)}
.ttfab .dot{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel)}
.ttfab .busy{position:absolute;inset:-6px;border-radius:50%;border:3px solid transparent;border-top-color:#b18cff;animation:ttspin 1s linear infinite}
@keyframes ttspin{to{transform:rotate(360deg)}}
.ttpop{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom,0));width:min(390px,calc(100vw - 24px));height:min(560px,calc(100vh - 120px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(10,12,20,.32);display:flex;flex-direction:column;overflow:hidden;z-index:41}
.ttpop .ph{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.ttpop .ph .nm{flex:1;min-width:0}.ttpop .ph h3{margin:0;font-size:15px}
.ttpop .chat{height:auto;min-height:0;flex:1;padding:12px}
.ttpop .msg{font-size:13.5px;max-width:90%}
.ttpop .chips{padding:7px 10px 0;display:flex;gap:5px;flex-wrap:wrap}
.ttpop .chatin{padding:8px}
.ttpop .chatin textarea{min-height:40px;max-height:120px}
@media (max-width:600px){.ttpop{right:12px;left:12px;width:auto}.ttfab{right:14px}}
.prog{height:8px;background:var(--soft);border-radius:5px;overflow:hidden}.prog>div{height:100%;background:var(--ok)}
.tgrp2{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tgrp2>.gh{padding:7px 12px;background:var(--soft);font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-top:1px solid var(--line)}
.task input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex:none;cursor:pointer}
.task .tx{flex:1;min-width:0;display:grid;gap:3px}
.task.done .tx>span:first-child{text-decoration:line-through;color:var(--muted)}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--off-bg);color:var(--off)}
.badge.carry{background:var(--warn-bg);color:var(--warn)} .badge.hi{background:var(--bad-bg);color:var(--bad)}
.emchip{font-family:var(--f-mono);font-size:11.5px;padding:1px 6px;border-radius:6px;background:var(--soft);cursor:pointer}
.emchip:hover{text-decoration:underline}
/* ---- AI ---- */
button.ai{border-color:var(--accent);color:var(--accent)}
.aibox{border:1px solid var(--accent);border-radius:10px;padding:12px;display:grid;gap:8px;background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.aibox>.gt{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.aiout{white-space:pre-wrap;font-size:14px}
.aiout ul,.aiout ol{margin:4px 0;padding-left:20px}
.aifilter{background:var(--soft);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tgrp{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tgrp>summary{cursor:pointer;padding:9px 12px;font-weight:700;font-size:14px;background:var(--soft);display:flex;justify-content:space-between;gap:8px}
.tgrp>summary .n{font-family:var(--f-mono);color:var(--bad)}
.titem{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:6px 12px;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.titem:hover{background:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>

<!-- LOADING -->
<div id="scrLoad" class="center"><div class="card" style="text-align:center"><div class="small">Đang kết nối…</div></div></div>

<!-- LOGIN -->
<div id="scrLogin" class="center" hidden>
  <form class="card" id="frmLogin">
    <h1>Sổ Kênh &amp; Mail</h1>
    <p class="sub">Đăng nhập bằng tài khoản bạn đã tạo trong Firebase.</p>
    <div class="field"><label for="liEmail">Email</label><input id="liEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="liPw">Mật khẩu đăng nhập</label>
      <div class="pwwrap"><input id="liPw" type="password" autocomplete="current-password" required><button type="button" data-peek="liPw">Hiện</button></div>
    </div>
    <div class="err" id="liErr"></div>
    <button class="primary" type="submit" id="liBtn">Đăng nhập</button>
  </form>
</div>

<!-- MASTER PASSWORD GATE -->
<div id="scrGate" class="center" hidden>
  <form class="card" id="frmGate">
    <h1 id="gateTitle">Mật khẩu chính</h1>
    <p class="sub" id="gateSub"></p>
    <div class="field"><label for="gPw">Mật khẩu chính</label>
      <div class="pwwrap"><input id="gPw" type="password" autocomplete="off" required><button type="button" data-peek="gPw">Hiện</button></div>
    </div>
    <div class="field" id="gPw2Wrap" hidden><label for="gPw2">Nhập lại mật khẩu chính</label>
      <div class="pwwrap"><input id="gPw2" type="password" autocomplete="off"><button type="button" data-peek="gPw2">Hiện</button></div>
    </div>
    <div class="err" id="gErr"></div>
    <button class="primary" type="submit" id="gBtn">Mở khóa</button>
    <p class="hint" id="gHint"></p>
    <button type="button" class="ghost" id="gLogout" style="justify-self:start">Đăng xuất</button>
  </form>
</div>

<!-- APP -->
<div id="scrApp" class="wrap" hidden>
  <header>
    <div>
      <h1 class="title">Sổ Kênh &amp; Mail</h1>
      <p class="sub">Email nhân viên, kênh YouTube và sự cố — dữ liệu mã hóa, đồng bộ mọi máy.</p>
    </div>
    <div class="hbtns">
      <button id="btnToday" class="ai">🌸 Thanh Thanh · Today</button>
      <button id="btnAsk" class="ai">✨ Hỏi AI</button>
      <button id="btnAiCfg" class="ghost" title="Cài đặt AI">⚙️ AI</button>
      <button id="btnImport">Nhập hàng loạt</button>
      <button id="btnDup">Quét trùng</button>
      <button id="btnExport">Xuất CSV</button>
      <button id="btnNewInc">Báo sự cố</button>

/* ZIP tối giản (không nén) để tải nhiều file passkey một lần */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function makeZip(files){ // files: [{name, text}]
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)),dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  for(const f of files){

    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+data.length;

}

function parseDateFlex(v){
  v=String(v??"").trim();if(!v)return null;
  let m=v.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]).getTime();
  m=v.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]).getTime()}
  if(/^\d{5}(\.\d+)?$/.test(v)){const t=Math.round((+v-25569)*DAY);const d=new Date(t);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()).getTime()}
  return null;
}

$("frmGate").addEventListener("submit",async e=>{
  e.preventDefault();$("gErr").textContent="";$("gBtn").disabled=true;

    const meta=await getDoc(doc(db,"meta","crypto"));

      if(pw!==$("gPw2").value){$("gErr").textContent="Hai ô mật khẩu chính chưa khớp.";return}
      const salt=crypto.getRandomValues(new Uint8Array(16));
      CKEY=await deriveKey(pw,salt);
      const verifier=await encField(VERIFY_CONST);
      await setDoc(doc(db,"meta","crypto"),{salt:b64(salt),verifier,createdAt:Date.now()});
      cacheMk(pw);enterApp();
    }else{
      if(!await tryUnlock(pw,meta)){$("gErr").textContent="Sai mật khẩu chính.";CKEY=null}
    }
  }catch(err){$("gErr").textContent="Lỗi: "+(err.code||err.message)}
  finally{$("gBtn").disabled=false}
});

async function tryUnlock(pw,meta){
  const d=meta.data();
  CKEY=await deriveKey(pw,unb64(d.salt));
  const check=await decField(d.verifier);
  if(check===VERIFY_CONST){cacheMk(pw);enterApp();return true}
  CKEY=null;return false;
}

/* ---------------- side sheet ---------------- */
function closeSheet(){$("sheetHost").innerHTML=""}
function sheet(title,body,foot,o={}){
  $("sheetHost").innerHTML=`<div class="scrim"></div><aside class="sheet${o.wide?" wide":""}" role="dialog" aria-label="${esc(title)}"><div class="sheet-h"><h2>${esc(title)}</h2><button class="ghost" id="shX" aria-label="Đóng">✕</button></div><form id="frm" class="sheet-b" autocomplete="off">${body}<div class="err" id="ferr"></div></form><div class="sheet-f">${foot}</div></aside>`;
  $("sheetHost").querySelector(".scrim").onclick=closeSheet;$("shX").onclick=closeSheet;
  const f=$("sheetHost").querySelector("input,select,textarea");f&&f.focus();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

    <div class="row2">
      <div class="field"><label for="fBuyDate">Ngày mua</label><input id="fBuyDate" type="date" value="${esc(dinput(x.purchaseDate))}"></div>
      <div class="field"><label for="fBuySrc">Nguồn mua</label><input id="fBuySrc" value="${esc(x.purchaseSource)}" placeholder="Mua ở đâu / của ai"></div>
    </div>
    <div class="field"><label for="fAppeal">Tình trạng kháng (khi bị hạn chế)</label><select id="fAppeal">${opt(APPEAL,appealOf(x))}</select>${needAppealCheck(x)?'<span class="hint" style="color:var(--bad)">⏰ Đã kháng hơn 2 ngày — nên vào check kết quả.</span>':'<span class="hint">Chọn "Đã kháng chờ KQ"; sau 2 ngày app sẽ nhắc vào check.</span>'}</div>
    <div class="grp" id="gaGroup" ${stageOf(x)==="ga"?"":"hidden"}><div class="gt">Xác minh · kiếm tiền · gà (chỉ dùng cho gà)</div>
      <div class="field"><label for="fReview">Trạng thái duyệt (gà)</label><select id="fReview">${opt(GAREVIEW,reviewOf(x))}</select></div>
      <div class="cbs">
        ${cb("fCreated",x.gaCreated,"✅ Đã bấm tạo gà (nếu chưa = đang đợi đủ điều kiện)")}
        ${cb("fIdV",x.idVerified,"Đã xác minh danh tính")}
        ${cb("fTax",x.taxAdded,"Đã thêm thuế")}
        ${cb("fBank",x.bankAdded,"Đã thêm ngân hàng")}
        ${cb("fMon",x.monetized,"Kênh đã bật kiếm tiền")}
        ${cb("fSold",x.gaSold,"Gà đã bán")}
        ${cb("fDiss",x.gaDissed,"💀 Gà bị diss mail")}
      </div>
      <div class="field"><label for="fLinked">Nối vào kênh của mail nào</label><input id="fLinked" list="mailL" value="${esc(x.gaLinkedTo)}" placeholder="email kênh được nối vào"><datalist id="mailL">${S.accounts.filter(a=>a.id!==id).map(a=>`<option value="${esc(a.email)}">`).join("")}</datalist></div>
    </div>
    <div class="field"><label for="fNote">Ghi chú</label><textarea id="fNote">${esc(x.note)}</textarea></div>
    ${id?`<div style="display:grid;gap:8px">${reveal("rPw","Mật khẩu đã lưu")}${reveal("rRec","Khôi phục đã lưu")}${reveal("rTfa","Mã 2FA đã lưu")}</div>
      <div class="field"><label>Lịch sử sự cố (${hist.length})</label><div class="hist">${hist.length?hist.map(i=>`<div class="item"><b>${esc(INC_TYPE[i.type])}</b><span class="small">${fmt(i.createdAt)} · ${i.status==="resolved"?"Đã xử lý":"Đang mở"}</span>${i.detail?`<span>${esc(i.detail)}</span>`:""}</div>`).join(""):'<span class="small">Chưa có.</span>'}</div></div>`:""}
  `,`${id?`<button class="danger left" id="bDel">Xóa</button><button id="bInc">Báo sự cố</button>`:""}<button type="button" id="bCancel">Hủy</button><button class="primary" id="bSave">${id?"Lưu":"Thêm"}</button>`);
  $("bCancel").onclick=closeSheet;
  const phHint=()=>{const t=dparse($("fPhoneExp").value);const el=$("fPhoneHint");if(!el)return;
    if(!t){el.textContent="Chưa nhập ngày hết hạn — app sẽ không nhắc gia hạn.";return}
    const d=Math.ceil((t-Date.now())/DAY);
    el.innerHTML=d<=0?`<b style="color:var(--bad)">Đã hết hạn ${-d} ngày.</b>`:`Còn <b>${d}</b> ngày. App nhắc khi còn ≤ ${PHONE_WARN} ngày, báo gấp khi ≤ ${PHONE_URGENT} ngày.`};
  $("fPhoneExp").oninput=phHint;phHint();
  $("sheetHost").querySelectorAll("[data-ext]").forEach(b=>b.onclick=()=>{
    const cur=dparse($("fPhoneExp").value);const base=cur&&cur>Date.now()?cur:new Date(new Date().toDateString()).getTime();
    $("fPhoneExp").value=dinput(base+(+b.dataset.ext)*DAY);phHint()});
  // điền SĐT đã giải mã
  const phIn=$("fPhone");
  if(id&&hasVal(x.phone)){decField(x.phone).then(v=>{if(!phIn.isConnected)return;if(!phIn.value)phIn.value=v;phIn.placeholder="";phIn.dataset.loaded="1"})}
  else phIn.dataset.loaded="1";
  $("fStage").onchange=()=>{$("gaGroup").hidden=$("fStage").value!=="ga"};
  let pkDel=false,pkName="";
  const pkCheck=()=>{const t=$("fPkTxt").value;const el=$("fPkHint");if(!t.trim()){el.textContent="";return}const r=pkParse(t);
    const em=$("fEmail").value.trim().toLowerCase();
    el.innerHTML=pkInfoHtml(r)+(r.ok&&r.emails.length&&em&&!r.emails.includes(em)?`<br><b style="color:var(--bad)">⚠️ File này là passkey của ${esc(r.emails.join(", "))}, KHÔNG phải ${esc(em)}.</b>`:"")};
  $("fPkTxt").oninput=()=>{pkName="";pkCheck()};
  $("fPkFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("fPkTxt").value=r.result;pkName=f.name;pkCheck()};r.readAsText(f,"UTF-8")};
  if(id&&hasPasskey(x)){
    $("fPkCopy").onclick=()=>copyPasskey(id);$("fPkDl").onclick=()=>downloadPasskey(id);
    $("fPkDel").onclick=()=>{const b=$("fPkDel");if(!b.dataset.c){b.dataset.c=1;b.textContent="Bấm Lưu để xóa hẳn";pkDel=true;$("fPkState").innerHTML='<b style="color:var(--bad)">Sẽ xóa passkey khi bấm Lưu.</b>'}};
  }
  if(id){
    const secrets={rPw:x.password,rRec:x.recovery,rTfa:x.twofaRecovery};
    $("sheetHost").querySelectorAll("[data-rev]").forEach(b=>b.onclick=async()=>{
      const el=$(b.dataset.rev);if(el.dataset.shown){el.textContent="••••••";el.dataset.shown="";b.textContent="Hiện";return}
      const v=await decField(secrets[b.dataset.rev]);el.textContent=v||"(trống)";el.dataset.shown="1";b.textContent="Ẩn";
    });
    $("sheetHost").querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
      const v=await decField(secrets[b.dataset.copy]);if(!v){toast("Trống");return}
      try{await navigator.clipboard.writeText(v);toast("Đã chép")}catch(e){const el=$(b.dataset.copy);el.textContent=v;el.dataset.shown="1";toast("Bôi đen để chép")}
    });
    $("bInc").onclick=()=>openIncident(null,id);
    $("bDel").onclick=()=>{const b=$("bDel");if(b.dataset.c){saveWrap(()=>deleteDoc(doc(db,"accounts",id)),"Đã xóa mail")}else{b.dataset.c=1;b.textContent="Bấm nữa để xóa"}};
  }
  $("bSave").onclick=async()=>{
    const email=$("fEmail").value.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(email)){$("ferr").textContent="Nhập email hợp lệ.";return}
    if(S.accounts.some(a=>a.email===email&&a.id!==id)){$("ferr").textContent="Email này đã có.";return}
    $("bSave").disabled=true;
    try{
      const keep=(inp,old)=>$(inp).value?encField($(inp).value):Promise.resolve(id?(old||""):"");
      const appealVal=$("fAppeal").value;
      const appealedAt=appealVal==="appealed"?((appealOf(x)==="appealed"&&x.appealedAt)?x.appealedAt:Date.now()):null;
      const restrictVal=$("fRestrict").checked;
      const pkTxt=$("fPkTxt").value.trim();let pkPatch={passkeyDevice:$("fPkDev").value.trim()};
      if(pkTxt){const r=pkParse(pkTxt);if(!r.ok){$("ferr").textContent="File passkey "+r.err+".";$("bSave").disabled=false;return}
        if(r.emails.length&&!r.emails.includes(email)&&!$("bSave").dataset.pkok){$("ferr").textContent=`File passkey là của ${r.emails.join(", ")}, không phải ${email}. Bấm Lưu lần nữa nếu vẫn muốn gắn.`;$("bSave").dataset.pkok=1;$("bSave").disabled=false;return}
        pkPatch={...pkPatch,...pkMeta(r),passkeyJson:await encField(r.text),passkeyName:pkName||(x.passkeyName||""),passkeyDate:Date.now()}}
      else if(pkDel)pkPatch={...pkPatch,passkeyJson:"",passkeyName:"",passkeyDate:null,passkeyRp:"",passkeyUser:"",passkeyCount:0,passkeyCreated:null};
      const d={...pkPatch,passkeyInstalled:$("fPkIns").checked,email,staff:$("fStaffIn").value.trim(),location:$("fLoc").value,infoChanged:$("fChg").checked,
        restricted:restrictVal,channelStatus:restrictVal?"limited":"normal",channelUrl:$("fChUrl").value.trim(),phoneLink:$("fPhoneLink").value.trim(),note:$("fNote").value.trim(),
        stage:$("fStage").value,workStartDate:dparse($("fWork").value),purchaseDate:dparse($("fBuyDate").value),purchaseSource:$("fBuySrc").value.trim(),
        phoneDate:null,phoneExpiry:dparse($("fPhoneExp").value),proxyId:$("fPx").value,keyId:$("fKey2").value,appeal:appealVal,appealedAt,
        idVerified:$("fIdV").checked,taxAdded:$("fTax").checked,bankAdded:$("fBank").checked,monetized:$("fMon").checked,gaSold:$("fSold").checked,gaDissed:$("fDiss").checked,gaCreated:$("fCreated").checked,gaLinkedTo:$("fLinked").value.trim(),gaReview:$("fReview").value,
        password:await keep("fPw",x.password),recovery:await keep("fRec",x.recovery),
        twofaRecovery:await keep("fTfaRec",x.twofaRecovery),updatedAt:Date.now(),createdAt:x.createdAt||Date.now()};
      // SĐT: ô đã điền sẵn → để trống nghĩa là xóa SĐT (trừ khi chưa giải mã xong)
      const phTyped=$("fPhone").value.trim();
      const phLoaded=$("fPhone").dataset.loaded==="1";
      d.phone=phTyped?await encField(phTyped):(phLoaded?"":(x.phone||""));
      // vân tay chống trùng
      const phonePlain=phTyped||(!phLoaded&&id&&hasVal(x.phone)?await decField(x.phone):"");
      const tfaPlain=$("fTfaRec").value.trim()||(id&&hasVal(x.twofaRecovery)?await decField(x.twofaRecovery):"");
      d.phoneHash=await hashPhone(phonePlain);
      d.twofaHash=await hash2fa(tfaPlain);
      if(d.phoneHash){const same=[];for(const a of S.accounts){if(a.id===id)continue;if(await phoneHashOf(a)===d.phoneHash)same.push(a.email)}
        if(same.length>=PHONE_SHARE_MAX){$("ferr").textContent=`SĐT này đã dùng cho ${same.length} mail (${same.join(", ")}) — mỗi SĐT tối đa ${PHONE_SHARE_MAX} mail.`;$("bSave").disabled=false;return}
        if(same.length)d.__share=same.join(", ")}
      if(d.twofaHash){for(const a of S.accounts){if(a.id===id)continue;if(await twofaHashOf(a)===d.twofaHash){$("ferr").textContent=`Mã 2FA này đã dùng cho mail: ${a.email}`;$("bSave").disabled=false;return}}}
      const {id:_drop,...prev}=id?x:{};
      const share=d.__share;delete d.__share;
      await setDoc(doc(db,"accounts",id||crypto.randomUUID()),{...prev,...d}); // giữ các trường không có trong form (vd tên kênh)
      closeSheet();toast((id?"Đã lưu":"Đã thêm mail")+(share?` · SĐT dùng chung với ${share}`:""));
    }catch(e){$("ferr").textContent="Lưu lỗi: "+(e.code||e.message);$("bSave").disabled=false}
  };
}

function openIncident(id,accId){
  if(!S.accounts.length){toast("Thêm mail trước");return}
  const i=id?S.incidents.find(x=>x.id===id):{type:"copyright",severity:2,status:"open",accountId:accId};
  const accs=[...S.accounts].sort((a,b)=>(a.channelName||a.email).localeCompare(b.channelName||b.email,"vi"));

/* "P01" | "1.2.3.4:8080" | "1.2.3.4:8080:user:pass" | "P01|1.2.3.4:8080:user:pass" */
function parseProxyText(v){
  v=String(v||"").trim();if(!v)return null;
  let name="",rest=v;
  if(v.includes("|")){[name,rest]=v.split("|").map(s=>s.trim())}
  const m=rest.match(/^(?:(https?|socks5h?):\/\/)?(?:([^:@\s]+):([^@\s]+)@)?([\w.-]+):(\d{2,5})(?::([^:\s]+):(\S+))?$/i);
  if(!m)return {name:name||v,server:"",auth:"",type:"http"};
  const server=`${m[4]}:${m[5]}`;const user=m[2]||m[6]||"",pass=m[3]||m[7]||"";
  return {name:name||server,server,auth:user?`${user}:${pass}`:"",type:/socks/i.test(m[1]||"")?"socks5":"http"};
}
function parseText(txt){
  const lines=txt.replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return{cols:[],rows:[]};
  // Trường hợp chỉ dán danh sách email (mỗi dòng một email, không có tiêu đề)
  const noDelim=lines.every(l=>!/[\t,;]/.test(l));
  const emailish=lines.filter(l=>EMAIL_RE.test(l)).length;
  if(noDelim&&EMAIL_RE.test(lines[0])&&emailish>=Math.ceil(lines.length*0.6)){
    return{cols:["email"],header:["email"],rows:lines.map(l=>[l]),bare:true};
  }
  const delim=lines[0].includes("\t")?"\t":(lines[0].split(";").length>lines[0].split(",").length?";":",");
  const cells=l=>l.split(delim).map(c=>c.trim().replace(/^"|"$/g,""));
  const header=cells(lines[0]);const cols=header.map(mapHeader);
  const rows=lines.slice(1).map(l=>cells(l));
  return{cols,header,rows};
}

    const hit=findKey(topic,name)||newKeys.find(k=>stripD(k.name)===stripD(name)&&(!topic||stripD(k.topic)===stripD(topic)));
    if(hit)return hit.id;
    const kid=crypto.randomUUID();const d={name,topic,links:[],note:"",createdAt:Date.now(),updatedAt:Date.now()};
    batch.set(doc(db,"keys",kid),d);n++;keyNew++;newKeys.push({id:kid,...d});
    return kid;
  };
  const proxyIdFor=async txt=>{
    const px=parseProxyText(txt);if(!px)return "";
    const hit=pxByKey.get(px.name.toLowerCase())||(px.server&&pxByKey.get(px.server.toLowerCase()));
    if(hit)return hit;
    const pid=crypto.randomUUID();
    batch.set(doc(db,"proxies",pid),{name:px.name,server:px.server,auth:await encField(px.auth),type:px.type,provider:"",expiry:null,cap:PROXY_CAP,note:"",createdAt:Date.now()});n++;pxNew++;
    pxByKey.set(px.name.toLowerCase(),pid);if(px.server)pxByKey.set(px.server.toLowerCase(),pid);
    return pid;
  };
  try{
    for(const r of valid){
      const g=k=>ci[k]!=null?String(r[ci[k]]??"").trim():"";
      const email=g("email").toLowerCase();
      if(existing.has(email)){skipped.push({email,reason:"Trùng email đã có"});continue}
      const tfaFlag=g("twofaFlag");const tfaRec=g("twofaRecovery");const phPlain=g("phone");
      const phh=await hashPhone(phPlain), thh=await hash2fa(tfaRec);
      if(phh&&(existPhone.get(phh)||[]).length>=PHONE_SHARE_MAX){skipped.push({email,reason:`SĐT đã đủ ${PHONE_SHARE_MAX} mail với `+existPhone.get(phh).join(", ")});continue}
      if(thh&&exist2fa.has(thh)){skipped.push({email,reason:"Trùng mã 2FA với "+exist2fa.get(thh)});continue}
      existing.add(email);if(phh)existPhone.set(phh,[...(existPhone.get(phh)||[]),email]);if(thh)exist2fa.set(thh,email);
      const isRes=yesText(g("restricted"));
      const d={email,staff:g("staff"),channelName:g("channelName"),channelUrl:g("channelUrl"),note:g("note"),
        location:locFromText(g("location"))||defLoc,infoChanged:yesText(g("infoChanged")),passkeyInstalled:yesText(g("passkeyInstalled")),
        restricted:isRes,phoneLink:g("phoneLink"),channelStatus:isRes?"limited":"normal",
        stage:stageFromText(g("stage")),appeal:"none",appealedAt:null,workStartDate:parseDateFlex(g("workStartDate")),
        purchaseDate:parseDateFlex(g("purchaseDate")),purchaseSource:g("purchaseSource"),phoneDate:null,phoneExpiry:parseDateFlex(g("phoneExpiry")),
        proxyId:await proxyIdFor(g("proxy")),keyId:keyIdFor(g("topic"),g("key")),
        idVerified:false,taxAdded:false,bankAdded:false,monetized:false,gaSold:false,gaDissed:false,gaCreated:false,gaLinkedTo:"",gaReview:"waiting",
        phoneHash:phh,twofaHash:thh,
        twofaStatus:(tfaRec||/^(co|yes|on|bat|x|1|true)$/i.test(stripD(tfaFlag)))?"on":"off",
        password:await encField(g("password")),recovery:await encField(g("recovery")),phone:await encField(phPlain),
        twofaRecovery:await encField(tfaRec),createdAt:Date.now(),updatedAt:Date.now()};
      batch.set(doc(db,"accounts",crypto.randomUUID()),d);added++;n++;
      if(n>=400){await batch.commit();batch=writeBatch(db);n=0}
    }
    if(n>0)await batch.commit();
  }catch(e){e.added=added;throw e}
  return {added,pxNew,keyNew,skipped};
}
const importMsg=({added,pxNew,keyNew,skipped})=>{
  const c={};skipped.forEach(s=>{const k=s.reason.split(" với ")[0];c[k]=(c[k]||0)+1});
  const sk=Object.entries(c).map(([k,v])=>`${v} ${k.toLowerCase()}`);
  return `Đã nhập ${added} mail${pxNew?`, tạo ${pxNew} proxy mới`:""}${keyNew?`, tạo ${keyNew} key mới`:""}${sk.length?`, bỏ qua ${sk.join(", ")}`:""}`;
};

/* ---------- Bảng nhập cố định (như Excel, ngay trong app) ---------- */
const GRID_SELECT={"Nơi quản lý":["","Nhà","Công ty"],"Giai đoạn":["","Đang làm","Chuẩn bị làm lại","Tạo gà"],"Đã đổi TT":["","Có"],"Bị hạn chế":["","Có"],"Đã cài passkey":["","Có"]};
const GRID_DATE=new Set(["Hạn SĐT","Ngày mua","Ngày bắt đầu làm"]);
const GRID_W={"Email":210,"Mật khẩu":120,"Mail khôi phục":170,"SĐT":115,"Link SĐT":170,"Hạn SĐT":100,"Mã 2FA":150,"Đã cài passkey":100,"Proxy":150,"Chủ đề":120,"Key":110,"Nhân viên":110,"Nơi quản lý":100,"Giai đoạn":130,"Ngày mua":100,"Nguồn mua":110,"Ngày bắt đầu làm":110,"Tên kênh":140,"Link kênh":180,"Đã đổi TT":80,"Bị hạn chế":80,"Ghi chú":180};
let GRID=null; // giữ trong bộ nhớ (không lưu đĩa vì có mật khẩu) — mất khi khóa / tải lại trang
const gridNewRow=()=>({v:TEMPLATE_HEAD.map(()=>""),err:""});
function gridEnsure(n){if(!GRID)GRID=[];while(GRID.length<n)GRID.push(gridNewRow())}
const gridFilled=r=>r.v.some(x=>String(x).trim());
function gridIsBad(h,val){
  val=String(val||"").trim();
  if(h==="Email")return !EMAIL_RE.test(val);
  if(GRID_DATE.has(h))return !!val&&!parseDateFlex(val);
  return false;
}
/* quy giá trị dán vào (vd "cty", "x", "dang lam") về đúng lựa chọn của ô chọn */
function gridSelVal(h,v){
  v=String(v||"").trim();const ops=GRID_SELECT[h];if(!v||ops.includes(v))return v;
  if(h==="Nơi quản lý")return ({home:"Nhà",company:"Công ty"})[locFromText(v)]||"";
  if(h==="Giai đoạn")return ({working:"Đang làm",redo:"Chuẩn bị làm lại",ga:"Tạo gà"})[stageFromText(v)]||"";
  return yesText(v)?"Có":"";
}
function gridRowHtml(r,i){
  return `<tr data-gr="${i}" class="${r.err?"gerr":""}"><td class="gnum">${i+1}</td><td class="gstat">${r.err?`<span class="mchip" title="${esc(r.err)}">${esc(r.err)}</span>`:""}</td>${TEMPLATE_HEAD.map((h,c)=>{
    const v=r.v[c];const cls=gridFilled(r)&&gridIsBad(h,v)?"bad":"";
    if(GRID_SELECT[h]){const cur=gridSelVal(h,v);r.v[c]=cur;
      return `<td class="${cls}"><select data-c="${c}">${GRID_SELECT[h].map(o=>`<option ${o===cur?"selected":""}>${esc(o)}</option>`).join("")}</select></td>`}
    return `<td class="${cls}"><input data-c="${c}" value="${esc(v)}" ${GRID_DATE.has(h)?'placeholder="dd/mm/yyyy"':""} ${h==="SĐT"?'inputmode="tel"':""} autocomplete="off" spellcheck="false"></td>`;
  }).join("")}<td><button type="button" class="mini ghost" data-gdel="${i}" title="Xóa dòng">✕</button></td></tr>`;
}
function gridRender(){
  const tb=$("gridBody");if(!tb)return;
  tb.innerHTML=GRID.map(gridRowHtml).join("");
  gridCount();
}
function gridCount(){
  const rows=GRID.filter(gridFilled);
  const ok=rows.filter(r=>EMAIL_RE.test(String(r.v[0]).trim())).length;
  const bad=rows.length-ok;
  const b=$("bGridAdd");if(b){b.disabled=!ok;b.textContent=ok?`➕ Thêm ${ok} mail`:"➕ Thêm"}
  const s=$("gridInfo");if(s)s.innerHTML=`${rows.length} dòng đã điền · <b style="color:var(--ok)">${ok} hợp lệ</b>${bad?` · <b style="color:var(--bad)">${bad} thiếu/sai email</b>`:""}`;
}
function gridMarkRow(i){
  const tr=document.querySelector(`#gridBody tr[data-gr="${i}"]`);if(!tr)return;
  const r=GRID[i];
  tr.querySelectorAll("[data-c]").forEach(el=>{const h=TEMPLATE_HEAD[+el.dataset.c];el.parentElement.classList.toggle("bad",gridFilled(r)&&gridIsBad(h,r.v[+el.dataset.c]))});
}
/* dán nhiều ô từ Excel/Google Sheet */
function gridPaste(r0,c0,text){
  let lines=text.replace(/\r/g,"").split("\n");while(lines.length&&!lines[lines.length-1].trim())lines.pop();
  let rows=lines.map(l=>l.split("\t"));
  let colMap=null;
  if(rows.length&&rows[0].some(x=>!EMAIL_RE.test(x.trim())&&mapHeader(x)==="email")){ // có dòng tiêu đề → nhận cột theo tên
    const want=TEMPLATE_HEAD.map(mapHeader);
    colMap=rows[0].map(h=>{const f=mapHeader(h);return f?want.indexOf(f):-1});
    rows=rows.slice(1);c0=0;
  }
  gridEnsure(r0+rows.length+3);
  rows.forEach((cells,k)=>{const r=GRID[r0+k];r.err="";cells.forEach((v,j)=>{const c=colMap?colMap[j]:c0+j;if(c>=0&&c<TEMPLATE_HEAD.length)r.v[c]=v.trim()})});
  gridRender();
  toast(`Đã dán ${rows.length} dòng`);
}
async function gridSubmit(){
  const filled=GRID.map((r,i)=>({r,i})).filter(({r})=>gridFilled(r));
  const ok=filled.filter(({r})=>EMAIL_RE.test(String(r.v[0]).trim()));
  if(!ok.length)return;
  const b=$("bGridAdd");b.disabled=true;
  try{
    const res=await importRows({cols:TEMPLATE_HEAD.map(mapHeader),rows:ok.map(({r})=>r.v)},$("impLoc").value,t=>{if(b.isConnected)b.textContent=t});
    const skip=new Map(res.skipped.map(s=>[s.email,s.reason]));
    // giữ lại dòng bị bỏ qua (kèm lý do) và dòng sai email; xóa dòng đã nhập
    GRID=GRID.filter(r=>{if(!gridFilled(r))return false;const em=String(r.v[0]).trim().toLowerCase();if(!EMAIL_RE.test(em)){r.err="Email sai";return true}if(skip.has(em)){r.err=skip.get(em);return true}return false});
    gridEnsure(Math.max(10,GRID.length+5));gridRender();
    toast(importMsg(res));
    $("gridMsg").innerHTML=`<div class="imp-prev" style="color:var(--ok)">✓ ${esc(importMsg(res))}${res.skipped.length?" — các dòng bị bỏ qua vẫn để lại trong bảng, kèm lý do.":""}</div>`;
  }catch(e){$("gridMsg").innerHTML=`<div class="imp-prev" style="color:var(--bad)">Lỗi khi nhập: ${esc(e.code||e.message)}. Đã nhập ${e.added||0} mail trước đó.</div>`}
  finally{gridCount()}
}

function downloadFile(name,text,type){
  const url=URL.createObjectURL(new Blob([text],{type:type||"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function downloadTemplate(){

  toast("Đã tải file mẫu");
}

/* =====================================================================
   TODAY LIST · THƯ KÝ THANH THANH · LỊCH SỬ
   Mỗi ngày một doc ở collection "days" (id = YYYY-MM-DD):
   {date,tasks:[{id,text,group,emails,prio,done,doneAt,src,carriedFrom,carryCount,carried,carriedTo}],
    issues:[{id,text,at,src}],chat:[{role,text,raw,at,chg}],summary,createdAt,updatedAt}
   Việc chưa xong của ngày trước tự DỒN sang hôm nay.
   ===================================================================== */
const dayKey=(t=Date.now())=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const dayLabel=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("vi-VN",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})};
const dayShort=k=>{const p=String(k||"").split("-");return p.length===3?`${p[2]}/${p[1]}`:k};
const dayById=k=>S.days.find(d=>d.id===k);
const newTid=()=>crypto.randomUUID().slice(0,8);
const stripId=({id,...r})=>r;
const TT_GROUPS=["Làm lại API","Gia hạn SĐT","Kháng / hạn chế","Proxy","Nhập / cập nhật mail","Kênh & nội dung","Khác"];
const normTask=s=>stripD(String(s||"")).replace(/\s+/g," ");
let DAY_INIT=false, DAY_ENSURING=false;
const TT={busy:false,draft:"",tts:(()=>{try{return localStorage.getItem("skm-tts")==="1"}catch(e){return false}})()};

/* tạo doc hôm nay + dồn việc chưa xong của ngày gần nhất trước đó */
async function ensureToday(){
  if(DAY_ENSURING)return;DAY_ENSURING=true;
  try{
    const k=dayKey();
    const prev=S.days.filter(d=>d.id<k).sort((a,b)=>b.id.localeCompare(a.id))[0];
    const today=dayById(k);
    const carry=prev?(prev.tasks||[]).filter(t=>!t.done&&!t.carried&&!t.dropped):[];
    if(today&&!carry.length)return;
    const base=today?stripId(today):{date:k,tasks:[],issues:[],chat:[],summary:null,createdAt:Date.now()};
    const have=new Set((base.tasks||[]).map(t=>normTask(t.text)));
    const moved=carry.filter(t=>!have.has(normTask(t.text))).map(t=>({...t,id:newTid(),carriedFrom:t.carriedFrom||prev.id,carryCount:(t.carryCount||0)+1,done:false,doneAt:null,carried:false,carriedTo:null}));
    const batch=writeBatch(db);
    batch.set(doc(db,"days",k),{...base,tasks:[...moved,...(base.tasks||[])],updatedAt:Date.now()});
    if(carry.length){const ids=new Set(carry.map(t=>t.id));batch.update(doc(db,"days",prev.id),{tasks:prev.tasks.map(t=>ids.has(t.id)?{...t,carried:true,carriedTo:k}:t),updatedAt:Date.now()})}
    await batch.commit();
    if(moved.length)toast(`Đã dồn ${moved.length} việc chưa xong từ ${dayShort(prev.id)} sang hôm nay`);
  }finally{DAY_ENSURING=false}
}
function todayDoc(){return dayById(dayKey())}
async function saveToday(patch){
  const d=todayDoc();if(!d){await ensureToday();return}
  Object.assign(d,patch);render();
  try{await updateDoc(doc(db,"days",d.id),{...patch,updatedAt:Date.now()})}catch(e){toast("Lưu lỗi: "+(e.code||e.message))}
}
const emailSet=()=>new Map(S.accounts.map(a=>[String(a.email).toLowerCase(),a]));
function addTasks(list,src){
  const d=todayDoc();if(!d)return 0;
  const have=new Set((d.tasks||[]).map(t=>normTask(t.text)));const known=emailSet();let n=0;
  const add=list.filter(x=>x.text&&x.text.trim()&&!have.has(normTask(x.text))).map(x=>{n++;have.add(normTask(x.text));
    return {id:newTid(),text:x.text.trim(),group:x.group||"Khác",emails:[...new Set((x.emails||[]).map(e=>String(e).toLowerCase()).filter(e=>known.has(e)))].slice(0,200),
      prio:x.prio==="cao"?"cao":"thuong",done:false,doneAt:null,src,carriedFrom:null,carryCount:0,createdAt:Date.now()}});
  if(n)saveToday({tasks:[...(d.tasks||[]),...add]});
  return n;
}
function toggleTask(id){const d=todayDoc();if(!d)return;saveToday({tasks:d.tasks.map(t=>t.id===id?{...t,done:!t.done,doneAt:!t.done?Date.now():null}:t)})}
function delTask(id){const d=todayDoc();if(!d)return;saveToday({tasks:d.tasks.filter(t=>t.id!==id)})}
function addIssue(text,src){const d=todayDoc();if(!d||!text.trim())return;saveToday({issues:[...(d.issues||[]),{id:newTid(),text:text.trim(),at:Date.now(),src}]})}

function remindGroupOf(title){const t=stripD(title);if(t.includes("sdt"))return "Gia hạn SĐT";if(t.includes("khang"))return "Kháng / hạn chế";if(t.includes("proxy"))return "Proxy";if(t.includes("thieu")||t.includes("doi thong tin"))return "Nhập / cập nhật mail";if(t.includes("su co"))return "Kênh & nội dung";return "Khác"}

}

async function ttUndo(idx){
  const d=todayDoc();if(!d)return;const m=(d.chat||[])[idx];if(!m||!m.undo||m.undone)return;
  if(!confirm("Hoàn tác các thao tác Thanh Thanh đã làm ở tin nhắn này?"))return;
  const ops=m.undo.ops||[...(m.undo.acc||[]).map(x=>({c:"accounts",id:x.id,t:"upd",p:x.p})),...(m.undo.inc||[]).map(id=>({c:"incidents",id,t:"del"}))];
  const has=(c,id)=>c==="accounts"?!!accById(id):c==="proxies"?!!proxyById(id):c==="keys"?!!keyById(id):S.incidents.some(i=>i.id===id);
  try{
    let batch=writeBatch(db),n=0;
    for(const o of [...ops].reverse()){const ref=doc(db,o.c,o.id);
      if(o.t==="set")batch.set(ref,o.d);else if(o.t==="del")batch.delete(ref);else{if(!has(o.c,o.id))continue;batch.update(ref,{...o.p,updatedAt:Date.now()})}
      if(++n>=400){await batch.commit();batch=writeBatch(db);n=0}}
    if(n)await batch.commit();
    const cur=todayDoc();
    const chat=cur.chat.map((x,i)=>i===idx?{...x,undone:true}:x);
    const actions=(cur.actions||[]).map(a=>a.at===m.at?{...a,undone:true}:a);
    await saveToday({chat,actions});toast("Đã hoàn tác");
  }catch(e){toast("Hoàn tác lỗi: "+(e.code||e.message))}
}

async function ttPlanDecide(idx,ok){
  const d=todayDoc();const m=d?.chat?.[idx];if(!m?.plan||m.plan.status!=="pending"||TT.applying)return;
  TT.applying=true;render();
  try{
    let nm;const cur0=todayDoc();let actions=cur0.actions||[];
    if(!ok)nm={...m,plan:{...m.plan,status:"rejected",at:Date.now()}};
    else{
      const ap=await ttApply(m.plan.acts,m.plan.text,false);
      nm={...m,plan:{...m.plan,status:"done",at:Date.now()},acts:ap.lines,actErr:[...ap.errors,...(ap.unknown.length?[`${ap.unknown.length} email không có trong hệ thống: ${ap.unknown.join(", ")}`]:[])]};
      if(ap.undo)nm.undo=ap.undo;
      if(ap.lines.length)actions=[...actions,{at:m.at,text:ap.lines.join("; "),by:"thanhthanh"}];
      toast(ap.lines.length?"Đã làm: "+ap.lines.join("; "):"Không có gì để làm");
    }
    const cur=todayDoc();
    await saveToday({chat:cur.chat.map((x,i)=>i===idx?nm:x),actions});
  }catch(e){toast("Lỗi khi làm: "+(e.code||e.message))}
  finally{TT.applying=false;render()}
}

async function ttSend(text){
  text=String(text||"").trim();if(!text||TT.busy)return;
  if(!todayDoc())await ensureToday();
  const d=todayDoc();if(!d){toast("Chưa tạo được Today list");return}
  const chat=[...(d.chat||[]),{role:"user",text,at:Date.now()}];
  TT.busy=true;TT.draft="";["ttIn","ttpIn"].forEach(i=>{if($(i))$(i).value=""});
  await saveToday({chat});
  try{
    // dựng hội thoại: gộp các lượt cùng vai liền nhau (phòng khi lượt AI trước bị lỗi)
    const msgs=[];for(const m of chat.slice(-40)){const role=m.role==="assistant"?"assistant":"user";const content=role==="assistant"?(m.raw||m.text):m.text;
      if(msgs.length&&msgs[msgs.length-1].role===role)msgs[msgs.length-1].content+="\n"+content;else msgs.push({role,content})}
    while(msgs.length&&msgs[0].role!=="user")msgs.shift();
    const out=await aiCall({system:TT_SYSTEM()+"\n\n=== DỮ LIỆU HIỆN TẠI ===\n"+ttContext(),messages:msgs,schema:TT_SCHEMA(),effort:"medium"});
    for(const k of ["them_viec","xong_viec","xoa_viec","van_de","thao_tac"])if(!Array.isArray(out[k]))out[k]=[];
    out.tra_loi=String(out.tra_loi||"");
    const cur=todayDoc();
    const known=emailSet();const have=new Set((cur.tasks||[]).map(t=>normTask(t.text)));
    let tasks=[...(cur.tasks||[])];const chg={add:0,done:0,del:0,issue:0};
    for(const v of out.them_viec){if(!v.noi_dung.trim()||have.has(normTask(v.noi_dung)))continue;have.add(normTask(v.noi_dung));chg.add++;
      tasks.push({id:newTid(),text:v.noi_dung.trim(),group:v.nhom||"Khác",emails:[...new Set(v.emails.map(e=>String(e).toLowerCase()).filter(e=>known.has(e)))],prio:v.uu_tien,done:false,doneAt:null,src:"thanhthanh",carriedFrom:null,carryCount:0,createdAt:Date.now()})}
    const doneIds=new Set(out.xong_viec),delIds=new Set(out.xoa_viec);
    tasks=tasks.filter(t=>{if(delIds.has(t.id)){chg.del++;return false}return true}).map(t=>{if(doneIds.has(t.id)&&!t.done){chg.done++;return {...t,done:true,doneAt:Date.now()}}return t});
    const seenI=new Set((cur.issues||[]).map(i=>normTask(i.text)));
    const issues=[...(cur.issues||[]),...out.van_de.filter(s=>s.trim()&&!seenI.has(normTask(s))&&seenI.add(normTask(s))).map(s=>{chg.issue++;return {id:newTid(),text:s.trim(),at:Date.now(),src:"thanhthanh"}})];
    // thao tác thật trên dữ liệu
    let ap={lines:[],errors:[],unknown:[],undo:null},plan=null;
    const decide=out.duyet_de_xuat==="dong_y"||out.duyet_de_xuat==="bo_qua"?out.duyet_de_xuat:"";
    if(out.thao_tac.length&&!(decide==="dong_y"&&(cur.chat||[]).some(m=>m.plan?.status==="pending"))){
      if(TT.ask){try{const pv=await ttApply(out.thao_tac,text,true);ap={...pv,lines:[],undo:null};if(pv.lines.length)plan={acts:out.thao_tac,text,status:"pending",preview:pv.lines}}catch(e){ap.errors.push("Lỗi khi xem trước: "+(e.code||e.message))}}
      else{try{ap=await ttApply(out.thao_tac,text)}catch(e){ap.errors.push("Lỗi khi cập nhật: "+(e.code||e.message))}}
    }
    const at=Date.now();
    const msg={role:"assistant",text:out.tra_loi,raw:JSON.stringify(out),at,chg,acts:ap.lines,actErr:[...ap.errors,...(ap.unknown.length?[`${ap.unknown.length} email không có trong hệ thống: ${ap.unknown.join(", ")}`]:[])]};
    if(ap.undo)msg.undo=ap.undo;
    if(plan)msg.plan=plan;
    const actions=ap.lines.length?[...(cur.actions||[]),{at,text:ap.lines.join("; "),by:"thanhthanh"}]:(cur.actions||[]);
    await saveToday({tasks,issues,actions,chat:[...(cur.chat||chat),msg]});
    if(ap.lines.length)toast("Thanh Thanh đã cập nhật: "+ap.lines.join("; "));
    if(decide){const ch=todayDoc().chat||[];let k=-1;for(let x=ch.length-2;x>=0;x--)if(ch[x].plan?.status==="pending"){k=x;break}
      if(k>=0){TT.busy=false;await ttPlanDecide(k,decide==="dong_y")}}
    ttSpeak(out.tra_loi);
  }catch(e){
    const cur=todayDoc();
    await saveToday({chat:[...(cur.chat||chat),{role:"system",text:"⚠️ "+aiErr(e),at:Date.now()}]});
  }finally{TT.busy=false;render()}
}

/* giọng nói: nói vào mic (vi-VN) và đọc trả lời */
const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
let REC=null;
function micToggle(btn,ta){
  if(!SpeechRec){toast("Trình duyệt này chưa hỗ trợ nói — dùng Chrome hoặc Edge");return}
  if(REC){REC.stop();return}
  ta=ta||$("ttIn");const base=ta.value.trim()?ta.value.trim()+" ":"";
  REC=new SpeechRec();REC.lang="vi-VN";REC.interimResults=true;REC.continuous=true;
  REC.onresult=e=>{let fin="",tmp="";for(const r of e.results){if(r.isFinal)fin+=r[0].transcript;else tmp+=r[0].transcript}ta.value=base+fin+tmp;TT.draft=ta.value};
  REC.onerror=e=>{if(e.error!=="aborted")toast("Mic: "+e.error)};
  REC.onend=()=>{REC=null;btn.classList.remove("on");btn.textContent="🎤";ta.dispatchEvent(new Event("input"))};
  REC.start();btn.classList.add("on");btn.textContent="⏹";
}
function ttSpeak(text){
  if(!TT.tts||!window.speechSynthesis||!text)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text).replace(/^- /gm,"").slice(0,800));u.lang="vi-VN";u.rate=1.05;
  const v=speechSynthesis.getVoices().find(v=>/^vi/i.test(v.lang));if(v)u.voice=v;
  speechSynthesis.speak(u);
}

   ===================================================================== */
const AI_SDK_URL="https://esm.sh/@anthropic-ai/sdk@1.12.0";
const AI_DEFAULT="claude-opus-5-5";
const AI_MODELS={"claude-opus-5-5":"Claude Opus 5.5 — thông minh nhất (mặc định)","claude-sonnet-5-5":"Claude Sonnet 5.5 — nhanh, rẻ hơn","claude-haiku-5-5":"Claude Haiku 5.5 — rẻ nhất"};
const AI_FALLBACK_OK=new Set(["claude-opus-5-5","claude-sonnet-5-5"]); // Haiku không có fallback phía server
const AI={cfg:null,client:null,clientKey:"",SDK:null};
function aiReset(){AI.cfg=null;AI.client=null;AI.clientKey=""}

/* JSON schema helpers cho structured outputs */
const jStr={type:"string"};
const jArr=items=>({type:"array",items});
const jObj=props=>({type:"object",properties:props,required:Object.keys(props),additionalProperties:false});

async function aiCfg(){
  if(AI.cfg)return AI.cfg;
  if(!CKEY)return null;
  const s=await getDoc(doc(db,"meta","ai"));
  if(!s.exists())return null;
  const d=s.data();if(!hasVal(d.key))return null;
  const key=await decField(d.key);
  if(!key||key.startsWith("⚠️"))return null;
  AI.cfg={key,model:AI_MODELS[d.model]?d.model:AI_DEFAULT};
  return AI.cfg;
}
async function aiClient(){
  const cfg=await aiCfg();
  if(!cfg){const e=new Error("need-setup");e.needSetup=true;throw e}
  if(!AI.SDK)AI.SDK=(await import(AI_SDK_URL)).default;
  if(!AI.client||AI.clientKey!==cfg.key){AI.client=new AI.SDK({apiKey:cfg.key,dangerouslyAllowBrowser:true});AI.clientKey=cfg.key}
  return {c:AI.client,model:cfg.model};
}
/* Một lần gọi Claude. schema → trả về object đã parse; không schema → trả về text. */
/* chế độ AI lưu theo từng máy: "api" (khóa API) | "bridge" (gói tháng qua Claude Code, cầu nối localhost) */
const BRIDGE_DEFAULT="http://127.0.0.1:8787";
const lsGet=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const aiMode=()=>lsGet("skm-ai-mode","api");
const bridgeUrl=()=>lsGet("skm-bridge-url",BRIDGE_DEFAULT);
const bridgeModel=()=>{const m=lsGet("skm-bridge-model","claude-sonnet-5-5");return AI_MODELS[m]?m:"claude-sonnet-5-5"};
async function bridgeCall({system,user,messages,schema,effort}){
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),260000);
  let r;
  try{r=await fetch(bridgeUrl()+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,
      body:JSON.stringify({system,messages:messages||[{role:"user",content:user}],schema:schema||null,model:bridgeModel(),effort})})}
  catch(e){const err=new Error("bridge-down");err.bridgeDown=true;err.aborted=e.name==="AbortError";throw err}
  finally{clearTimeout(tm)}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok||!j||!j.ok){const err=new Error((j&&j.error)||("Cầu nối lỗi "+r.status));err.bridgeMsg=true;throw err}
  return j.data;
}
async function bridgeHealth(){
  try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),2500);const r=await fetch(bridgeUrl()+"/health",{signal:ctl.signal});const j=await r.json();return !!j.ok}catch(e){return false}
}
async function aiCall({system,user,messages,schema,effort="low",maxTokens=32000}){
  if(aiMode()==="bridge")return bridgeCall({system,user,messages,schema,effort});
  const {c,model}=await aiClient();
  const output_config={effort};
  if(schema)output_config.format={type:"json_schema",schema};
  const params={model,max_tokens:maxTokens,system,messages:messages||[{role:"user",content:user}],output_config};
  if(AI_FALLBACK_OK.has(model)){params.betas=["server-side-fallback-2026-07-01"];params.fallbacks="default"}
  const r=await c.beta.messages.stream(params).finalMessage();
  if(r.stop_reason==="refusal")throw new Error("AI từ chối xử lý yêu cầu này.");
  if(r.stop_reason==="max_tokens")throw new Error("Kết quả quá dài — hãy chia nhỏ dữ liệu rồi thử lại.");
  const text=r.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  return schema?JSON.parse(text):text;
}
function aiErr(e){
  if(e&&e.needSetup)return "Chưa cài AI — bấm ⚙️ AI để chọn gói tháng (cầu nối) hoặc khóa API.";
  if(e&&e.bridgeDown)return e.aborted?"Cầu nối trả lời quá lâu — thử lại.":"Chưa bật cầu nối Thanh Thanh trên máy này — bấm đúp file Bat-Thanh-Thanh.bat rồi thử lại. (Máy mới: ⚙️ AI → Tải cầu nối.)";
  if(e&&e.bridgeMsg)return e.message;
  const A=AI.SDK;
  if(A){
    if(e instanceof A.AuthenticationError)return "Khóa API không đúng hoặc đã bị thu hồi.";
    if(e instanceof A.PermissionDeniedError)return "Khóa API không có quyền dùng mô hình này.";
    if(e instanceof A.RateLimitError)return "Gọi AI quá nhiều / chạm hạn mức — đợi chút rồi thử lại.";
    if(e instanceof A.BadRequestError)return "Yêu cầu bị từ chối: "+e.message;
    if(e instanceof A.APIConnectionError)return "Không kết nối được tới Claude — kiểm tra mạng.";
    if(e instanceof A.APIError)return `Lỗi AI (${e.status}): ${e.message}`;
  }
  if(e instanceof SyntaxError)return "AI trả về dữ liệu không đọc được — thử lại.";
  return (e&&e.message)||String(e);
}
async function aiRun(btn,label,outEl,fn){
  const old=btn.textContent;btn.disabled=true;btn.textContent=label;
  if(outEl)outEl.innerHTML="";
  try{return await fn()}
  catch(e){
    const msg=aiErr(e);
    if(outEl)outEl.innerHTML=`<div class="err">${esc(msg)}${e&&(e.needSetup||e.bridgeDown)?' <button type="button" class="mini" data-aicfg>⚙️ Cài đặt AI</button>':""}</div>`;
    else toast(msg);
    outEl&&outEl.querySelector("[data-aicfg]")?.addEventListener("click",()=>openAiSettings());
  }
  finally{if(btn.isConnected){btn.disabled=false;btn.textContent=old}}
}

        schema:jObj({tra_loi:jStr,emails:jArr(jStr)}),

      const byEmail=new Map(la.map(a=>[String(a.email).toLowerCase(),a]));

      $("askOut").innerHTML=`<div class="aibox"><div class="gt">Trả lời</div><div class="aiout">${esc(out.tra_loi)}</div>
        ${hits.length?`<div class="small">${hits.length} mail khớp:</div><div class="imp-prev">${hits.slice(0,50).map(a=>`<div class="titem" data-open="${a.id}" style="border:none;padding:3px 0"><span class="mono">${esc(a.email)}</span><span class="small">${esc(a.staff||"")}</span></div>`).join("")}${hits.length>50?`<div class="small">… và ${hits.length-50} mail nữa</div>`:""}</div>

      $("askOut").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openAccount(el.dataset.open));
      if(hits.length){
        const apply=sel=>{
          S.aiIds=new Set(hits.map(a=>a.id));S.aiLabel=q.length>70?q.slice(0,70)+"…":q;
          S.tab=hits.every(isGa)?"ga":"acc";S.status="";S.staff="";S.q="";$("q").value="";

        };

        $("askSel").onclick=()=>apply(true);
      }

  };
}

async function aiAnalyzeIncident(incId){
  const raw=$("iRaw").value.trim(), detail=$("iDetail").value.trim();
  if(!raw&&!detail){$("iAiOut").innerHTML=`<div class="err">Dán thông báo hoặc ghi vài dòng mô tả trước.</div>`;return}
  const ac=accById($("iAcc").value);
  await aiRun($("iAi"),"Đang phân tích…",$("iAiOut"),async()=>{
    const hist=ac?S.incidents.filter(i=>i.accountId===ac.id&&i.id!==incId).map(aiIncRow):[];
    const out=await aiCall({
      system:AI_CONTEXT+`\nNhiệm vụ: phân tích một sự cố của kênh/email.
- loai: chọn đúng một mã: ${Object.entries(INC_TYPE).map(([k,v])=>`${k}=${v}`).join(", ")}.
- muc_do: "3" nghiêm trọng (có thể mất kênh/mail, bị hack, chấm dứt, gậy thứ 2 trở lên), "2" trung bình, "1" thấp.
- mo_ta: 1–3 câu ghi lại sự việc để lưu sổ (video nào, lý do, ngày).
- buoc_xu_ly: các bước cụ thể nên làm tiếp theo, theo thứ tự.
- nhap_khang_nghi: nếu nên kháng nghị thì viết bản nháp ngắn, lịch sự, TRUNG THỰC, chỉ dùng sự thật có trong dữ liệu; chỗ nào cần người dùng tự điền thì để [trong ngoặc vuông]. Nếu không nên kháng thì để chuỗi rỗng.`,
      user:`Hôm nay: ${aiToday()}\nMAIL/KÊNH: ${JSON.stringify(ac?aiRow(ac):{})}\nSỰ CỐ TRƯỚC ĐÂY: ${JSON.stringify(hist)}\nMÔ TẢ HIỆN TẠI: ${detail||"(trống)"}\nTHÔNG BÁO GỐC:\n${raw||"(không có)"}`,
      schema:jObj({loai:{type:"string",enum:Object.keys(INC_TYPE)},muc_do:{type:"string",enum:["1","2","3"]},mo_ta:jStr,buoc_xu_ly:jArr(jStr),nhap_khang_nghi:jStr}),
      effort:"medium"});
    if(!$("iType"))return; // sheet đã đóng
    $("iType").value=out.loai;$("iSev").value=out.muc_do;
    if(out.mo_ta)$("iDetail").value=out.mo_ta;
    $("iAiOut").innerHTML=`<div class="small" style="color:var(--ok)">✓ Đã điền loại lỗi, mức độ, mô tả — kiểm tra lại rồi bấm Lưu.</div>
      ${out.buoc_xu_ly.length?`<div><b>Bước xử lý gợi ý</b><ol class="aiout">${out.buoc_xu_ly.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`:""}
      ${out.nhap_khang_nghi?`<div class="field"><label>Nháp kháng nghị (sửa chỗ [ ] trước khi gửi)</label><textarea id="iAppeal" style="min-height:140px">${esc(out.nhap_khang_nghi)}</textarea><button type="button" class="mini" id="iAppealCp" style="justify-self:start">📋 Copy nháp</button></div>`:""}`;
    if(out.nhap_khang_nghi)$("iAppealCp").onclick=async()=>{const v=$("iAppeal").value;try{await navigator.clipboard.writeText(v);toast("Đã copy nháp")}catch(e){copyFallback(v,1)}};
  });
}

const AI_IMP_FIELDS=[["email","Email"],["password","Mật khẩu"],["recovery","Mail khôi phục"],["phone","SĐT"],["phoneLink","Link SĐT"],["phoneExpiry","Hạn SĐT"],["twofaRecovery","Mã 2FA"],["passkeyInstalled","Đã cài passkey"],["proxy","Proxy"],["topic","Chủ đề"],["key","Key"],["staff","Nhân viên"],["location","Nơi quản lý"],["purchaseDate","Ngày mua"],["purchaseSource","Nguồn mua"],["channelName","Tên kênh"],["channelUrl","Link kênh"],["note","Ghi chú"]];
async function aiSplitImport(preview){
  const txt=$("impText").value.trim();
  if(!txt){$("aiImpOut").innerHTML=`<div class="err">Dán dữ liệu vào ô phía trên trước.</div>`;return}
  if(txt.length>80000){$("aiImpOut").innerHTML=`<div class="err">Dữ liệu quá dài (${txt.length} ký tự) — chia thành nhiều lần, mỗi lần dưới 80.000 ký tự.</div>`;return}
  await aiRun($("bAiImp"),"Đang tách…",$("aiImpOut"),async()=>{
    const out=await aiCall({
      system:AI_CONTEXT+`\nNhiệm vụ: chuyển dữ liệu dán lộn xộn thành danh sách tài khoản. Mỗi tài khoản là một email.
- Chép NGUYÊN VĂN giá trị (mật khẩu, mã… không được sửa, không đoán). Thiếu thì để chuỗi rỗng.
- recovery: mail hoặc SĐT khôi phục. phone: SĐT gắn với tài khoản. twofaRecovery: các mã dự phòng 2FA, cách nhau bằng dấu cách. passkeyInstalled: "Có" nếu dữ liệu nói đã cài passkey, không thì rỗng.
- phoneLink: link trang quản lý/thuê số của SĐT. phoneExpiry: ngày hết hạn SĐT. proxy: tên proxy hoặc chuỗi ip:port:user:pass, chép nguyên văn. topic: chủ đề (vd "Ma Mỹ"), key: tên key, nếu dữ liệu có.
- location: "Nhà" hoặc "Công ty" nếu dữ liệu nói rõ, không thì rỗng. Mọi ngày (purchaseDate, phoneExpiry) ghi định dạng YYYY-MM-DD.
- Bỏ qua dòng không chứa email.`,
      user:txt,
      schema:jObj({rows:jArr(jObj(Object.fromEntries(AI_IMP_FIELDS.map(([k])=>[k,jStr]))))}),
      effort:"low",maxTokens:64000});
    if(!$("impText"))return;
    const clean=v=>String(v??"").replace(/[\t\r\n]+/g," ").trim();
    const rows=out.rows.filter(r=>EMAIL_RE.test(clean(r.email)));
    if(!rows.length)throw new Error("AI không tìm thấy email nào trong dữ liệu.");
    const tsv=[AI_IMP_FIELDS.map(f=>f[1]).join("\t"),...rows.map(r=>AI_IMP_FIELDS.map(([k])=>clean(r[k])).join("\t"))].join("\n");
    $("impText").value=tsv;preview();
    $("aiImpOut").innerHTML=`<div class="small" style="color:var(--ok)">✓ AI đã tách ${rows.length} tài khoản thành bảng ở ô trên. Kiểm tra lại rồi bấm Nhập.</div>`;
  });
}

  const ta=e.target.closest("[data-tadd]");if(ta){openKey(null,ta.dataset.tadd);e.stopPropagation();return}
  const te2=e.target.closest("[data-tedit]");if(te2){openTopic(te2.dataset.tedit);e.stopPropagation();return}
  const trw=e.target.closest("tr[data-topic]");if(trw){const t=trw.dataset.topic;S.keyFold.has(t)?S.keyFold.delete(t):S.keyFold.add(t);render();return}
  const kr=e.target.closest("tr[data-key]");if(kr){openKey(kr.dataset.key);return}
  const dr=e.target.closest("tr[data-day]");if(dr){openDay(dr.dataset.day);return}
  if(e.target.closest("#dayRoot"))return; // tab Today tự xử lý click của nó
  const cm=e.target.closest(".cpmail");if(cm){copyEmail(cm.dataset.email);e.stopPropagation();return}
  const cp=e.target.closest("[data-cpf]");if(cp){copySecret(cp.dataset.cid,cp.dataset.cpf);e.stopPropagation();return}
  const tg=e.target.closest("[data-tg]");if(tg){toggleField(tg.dataset.id,tg.dataset.tg);e.stopPropagation();return}
  const ck=e.target.closest("input.rowck");if(ck){toggleSel(ck.dataset.id,ck.checked);e.stopPropagation();return}
  if(e.target.id==="selAll"){toggleAll(e.target.checked);return}
  const tr=e.target.closest("tr[data-acc],tr[data-inc]");if(!tr)return;tr.dataset.acc?openAccount(tr.dataset.acc):openIncident(tr.dataset.inc);
});
</script>
</body>
</html>
